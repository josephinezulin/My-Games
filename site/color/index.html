<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>html, body, * { touch-action: manipulation; }</style>
<script>
  // Fast repeated taps must not zoom the page. iOS Safari ignores
  // user-scalable=no, so also stop pinch gestures and double-tap zoom here.
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
</script>
<title>色彩配對</title>
<meta name="description" content="色彩配對：用顏料桶調出和目標一模一樣的顏色。">
<style>
  :root { --ink: #3a2e28; --muted: #8a7c70; --panel: #fffaf2; --accent: #ff6a3d; --wood: #c98d55; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    background: linear-gradient(180deg, #d8d2cb 0%, #cfc7bd 38%, #a9744a 38.2%, #8f5f3a 44%, #e7e1d9 44.2%, #dcd5cc 100%);
    display: flex; flex-direction: column; align-items: center; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  nav.games { width: 100%; max-width: 480px; padding: 8px 16px 0; font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; }
  nav.games a { color: var(--ink); opacity: .6; text-decoration: none; font-weight: 600; }
  nav.games a.on { opacity: 1; text-decoration: underline; }
  header { width: 100%; max-width: 480px; padding: 4px 16px; display: flex; align-items: center; justify-content: space-between; }
  h1 { margin: 0; font-size: 17px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  header { gap: 8px; }
  header .row { flex-wrap: nowrap; gap: 4px; }
  header .row button { padding: 5px 8px !important; font-size: 12px !important; white-space: nowrap; }
  .game { flex: 1; width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; min-height: 0; padding: 0 12px 10px; }
  #target { width: 100%; flex: 1.05; min-height: 0; }
  .palette { position: relative; width: min(86%, 360px); aspect-ratio: 1.45; flex: 0 0 auto; touch-action: none; }
  #paint { width: 100%; height: 100%; display: block; }
  .meter { width: min(80%, 330px); height: 22px; border-radius: 11px; background: #0001; position: relative; overflow: hidden; margin: 2px 0 6px; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 11px; transition: width .2s, background .2s; }
  .meter span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #3a2e28; }
  .meter.off { display: none; }
  .mixbar { width: min(80%, 330px); height: 12px; border-radius: 6px; overflow: hidden; display: flex; background: #0001; margin-top: 6px; }
  .mixbar i { display: block; height: 100%; transition: width .15s; }
  .info { margin: 8px 0 24px; font-size: 13px; color: var(--muted); display: flex; gap: 12px; align-items: center; }
  .info b { color: var(--ink); }
  .buckets { display: flex; gap: 10px; justify-content: center; width: 100%; }
  .bucket { position: relative; flex: 1; max-width: 96px; transition: transform .1s; -webkit-tap-highlight-color: transparent; }
  .bucket.dip { transform: translateY(3px) scale(.97); }
  .bucket.water .top i { background: radial-gradient(circle at 40% 35%, #e6f6ff, #9fd3ef); }
  .bucket.water .tin { background: linear-gradient(90deg, #cfe9f7aa, #f2fbffcc 40%, #b7dbefaa); }
  .bucket .tin { height: 76px; border-radius: 10px 10px 16px 16px; background: linear-gradient(90deg, #cfd2d6, #f4f5f6 40%, #babfc4); position: relative; box-shadow: 0 6px 12px #0003; }
  .bucket .top { position: absolute; left: 0; right: 0; top: -14px; height: 30px; border-radius: 50%; background: #e9ebee; display: flex; align-items: center; justify-content: center; }
  .bucket .top i { width: 88%; height: 76%; border-radius: 50%; display: block; box-shadow: inset 0 3px 6px #0004; }
  .bucket .label { position: absolute; left: 18%; right: 18%; top: 28px; height: 28px; border-radius: 4px; border: 3px solid #fff8; }
  .bucket .name { text-align: center; font-size: 13px; font-weight: 700; margin-top: 6px; }
  .bucket .cnt { position: absolute; top: -22px; right: -4px; min-width: 24px; height: 24px; border-radius: 12px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 800; display: none; align-items: center; justify-content: center; padding: 0 6px; z-index: 2; }
  .bucket .cnt.on { display: flex; }
  .tools { display: flex; gap: 8px; margin-top: 12px; width: 100%; justify-content: center; }
  button { font: inherit; font-weight: 800; font-size: 15px; border: 0; border-radius: 14px; padding: 11px 16px; background: #fff; color: var(--ink); box-shadow: 0 3px 0 #0002; cursor: pointer; }
  button.primary { background: linear-gradient(180deg, #ff8a5c, #ff5a2a); color: #fff; flex: 1; max-width: 200px; }
  button:disabled { opacity: .45; }
  button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #0002; }
  body { touch-action: none; }
  .brush { position: fixed; left: 0; top: 0; width: 26px; height: 120px; pointer-events: none; z-index: 20; transform-origin: 13px 118px; filter: drop-shadow(2px 6px 4px #0004); }
  .brush .h { position: absolute; left: 9px; top: 0; width: 8px; height: 70px; border-radius: 4px; background: linear-gradient(90deg, #7a5cff, #b3a2ff 50%, #6a4ae8); }
  .brush .f { position: absolute; left: 5px; top: 66px; width: 16px; height: 16px; background: linear-gradient(90deg, #b8bcc4, #eef0f3 50%, #a9aeb6); border-radius: 2px; }
  .brush .b { position: absolute; left: 3px; top: 80px; width: 20px; height: 40px; border-radius: 4px 4px 10px 10px / 4px 4px 22px 22px; background: #d9c9a8; }
  .brush .p { position: absolute; left: 3px; bottom: 0; width: 20px; border-radius: 4px 4px 10px 10px / 4px 4px 22px 22px; transition: height .1s; }
  .overlay { position: fixed; inset: 0; background: #2a201a99; display: none; align-items: center; justify-content: center; padding: 16px; z-index: 30; }
  .overlay.show { display: flex; }
  .card { background: var(--panel); border-radius: 22px; padding: 20px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 16px 40px #0005; max-height: 90vh; overflow: auto; }
  .card h2 { margin: 0 0 6px; }
  .card p { color: var(--muted); margin: 0 0 12px; line-height: 1.5; }
  .pct { font-size: 52px; font-weight: 900; margin: 4px 0; }
  .stars { font-size: 30px; color: #ffb400; letter-spacing: 6px; min-height: 36px; }
  .swatches { display: flex; gap: 12px; justify-content: center; margin: 8px 0 14px; }
  .swatches div { width: 96px; }
  .swatches span { display: block; height: 64px; border-radius: 12px; box-shadow: inset 0 0 0 2px #0001; }
  .swatches small { color: var(--muted); }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 10px 0; }
  #levels button { padding: 8px 0; line-height: 1.2; font-size: 14px; }
  #levels button.done { background: #ffe3c4; }
  #levels button.cur { outline: 2px solid var(--accent); }
  #levels small { display: block; font-size: 10px; min-height: 12px; color: #c98a00; }
  .room { background: linear-gradient(180deg, #f3e6d3 0 70%, #d9b98f 70% 100%); border-radius: 14px; padding: 10px 8px 6px; margin: 8px 0 12px; text-align: left; }
  .room h3 { margin: 0 0 6px; font-size: 15px; }
  .shelf { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; border-bottom: 8px solid #a8743f; padding-bottom: 4px; margin-bottom: 8px; }
  .work { text-align: center; font-size: 10px; color: var(--muted); }
  .work canvas { width: 100%; aspect-ratio: 1; display: block; }
  .work b { display: block; color: var(--ink); font-size: 11px; }
  .help { text-align: left; color: var(--muted); font-size: 14px; padding-left: 18px; }
  .help li { margin-bottom: 4px; }
</style>
</head>
<body>
<nav class="games"><a href="../">Block Out</a><a href="../sultan/">蘇丹的遊戲</a><a href="../bounce/">Count and Bounce</a><a href="../lord/">最強領主</a><a href="../evony/">王者之路</a><a class="on" href="./">色彩配對</a></nav>
<header>
  <h1><span id="lvlName"></span></h1>
  <div class="row"><button id="btnMeter" style="padding:6px 10px;font-size:13px">提示：開</button><button id="btnGallery" style="padding:6px 10px;font-size:13px">展間</button><button id="btnLevels" style="padding:6px 10px;font-size:13px">選關</button><button id="btnHelp" style="padding:6px 10px;font-size:13px">說明</button></div>
</header>
<div class="game">
  <canvas id="target"></canvas>
  <div class="meter" id="meter"><i id="meterFill"></i><span id="meterTxt">相似度 --</span></div>
  <div class="palette" id="palette"><canvas id="paint"></canvas></div>
  <div class="mixbar" id="mixbar"></div>
  <div class="info" id="info">筆刷 <b id="loadTxt">乾淨</b>　調色盤 <b id="amountTxt">0</b> 份　上色 <b id="covTxt">0%</b></div>
  <div class="buckets" id="buckets"></div>
  <div class="tools">
    <button id="btnClear">清洗調色盤</button>
    <button class="primary" id="btnDone">比對顏色</button>
  </div>
</div>
<div class="brush" id="brush"><div class="h"></div><div class="f"></div><div class="b"></div><div class="p" id="brushPaint"></div></div>
<div class="overlay" id="box"><div class="card" id="boxCard"></div></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('color.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('color.' + k, JSON.stringify(v)); } catch (e) {} },
  };
  const PASS = 90;

  const PAINTS = {
    red: ['紅', [215, 30, 40]], yellow: ['黃', [255, 214, 22]], blue: ['藍', [32, 72, 205]], white: ['白', [250, 250, 248]],
    black: ['黑', [24, 24, 26]], pink: ['桃紅', [232, 52, 168]], green: ['綠', [36, 168, 74]], orange: ['橘', [255, 128, 10]], brown: ['棕', [120, 70, 32]],
  };

  // Paint mixing: a weighted geometric mean per channel, a cheap stand-in for
  // subtractive mixing (blue + yellow comes out green, black darkens fast).
  function mix(drops) {
    const total = Object.values(drops).reduce((a, b) => a + b, 0);
    if (!total) return null;
    const out = [0, 0, 0];
    for (const [k, n] of Object.entries(drops)) {
      if (!n) continue;
      PAINTS[k][1].forEach((c, i) => (out[i] += (n / total) * Math.log(Math.max(c, 4))));
    }
    return out.map(v => Math.round(Math.exp(v)));
  }
  function lab([r, g, b]) {
    const f = c => { c /= 255; return c > 0.04045 ? Math.pow((c + 0.055) / 1.055, 2.4) : c / 12.92; };
    const R = f(r), G = f(g), B = f(b);
    let x = (R * 0.4124 + G * 0.3576 + B * 0.1805) / 0.95047, y = R * 0.2126 + G * 0.7152 + B * 0.0722, z = (R * 0.0193 + G * 0.1192 + B * 0.9505) / 1.08883;
    const t = v => (v > 0.008856 ? Math.cbrt(v) : 7.787 * v + 16 / 116);
    x = t(x); y = t(y); z = t(z);
    return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
  }
  // Similarity from the CIE76 colour difference.
  function similarity(a, b) {
    if (!a) return 0;
    const [l1, a1, b1] = lab(a), [l2, a2, b2] = lab(b);
    const dE = Math.hypot(l1 - l2, a1 - a2, b1 - b2);
    return Math.max(0, Math.round(100 - dE * 1.5));
  }
  const css = c => `rgb(${c[0]},${c[1]},${c[2]})`;
  const shade = (c, k) => css(c.map(v => Math.max(0, Math.min(255, Math.round(v * k)))));

  // Hand-made levels: object, paints on offer, and the hidden recipe.
  const LEVELS = [
    ['apple', '蘋果', ['red', 'yellow', 'white'], { red: 3, yellow: 1 }],
    ['lemon', '檸檬', ['yellow', 'white', 'green'], { yellow: 3, white: 1 }],
    ['orange', '橘子', ['red', 'yellow', 'blue'], { red: 1, yellow: 2 }],
    ['eggplant', '茄子', ['pink', 'blue', 'black'], { pink: 2, blue: 2, black: 1 }],
    ['pepper', '青椒', ['yellow', 'blue', 'black'], { yellow: 3, blue: 2 }],
    ['strawberry', '草莓', ['red', 'pink', 'white'], { red: 3, pink: 1 }],
    ['grape', '葡萄', ['red', 'blue', 'white'], { red: 1, blue: 2, white: 1 }],
    ['banana', '香蕉', ['yellow', 'white', 'brown'], { yellow: 4, white: 1 }],
    ['carrot', '胡蘿蔔', ['red', 'yellow', 'white'], { red: 2, yellow: 3 }],
    ['chocolate', '巧克力', ['brown', 'black', 'red'], { brown: 3, black: 1 }],
    ['blossom', '櫻花', ['pink', 'white', 'red'], { pink: 1, white: 3 }],
    ['leaf', '抹茶', ['green', 'yellow', 'white'], { green: 2, yellow: 1, white: 1 }],
    ['pumpkin', '南瓜', ['orange', 'brown', 'yellow'], { orange: 3, brown: 1 }],
    ['watermelon', '西瓜', ['red', 'pink', 'white'], { red: 2, pink: 1, white: 1 }],
    ['blueberry', '藍莓', ['blue', 'black', 'pink'], { blue: 3, black: 1, pink: 1 }],
    ['apple', '青蘋果', ['green', 'yellow', 'white'], { green: 2, yellow: 2, white: 1 }],
    ['grape', '紫葡萄', ['pink', 'blue', 'black', 'white'], { pink: 2, blue: 3, black: 1 }],
    ['pepper', '紅甜椒', ['red', 'orange', 'brown', 'white'], { red: 3, orange: 1, brown: 1 }],
    ['eggplant', '淺茄子', ['pink', 'blue', 'white', 'black'], { pink: 2, blue: 2, white: 2, black: 1 }],
    ['chocolate', '牛奶巧克力', ['brown', 'white', 'orange', 'black'], { brown: 3, white: 2, orange: 1 }],
  ];
  const SHAPES = ['apple', 'lemon', 'orange', 'eggplant', 'pepper', 'strawberry', 'grape', 'banana', 'carrot', 'chocolate', 'blossom', 'leaf', 'pumpkin', 'watermelon', 'blueberry'];
  const MYSTERY = ['神秘果', '奇幻莓', '彩虹豆', '魔法瓜', '夢幻椒', '星光梨'];

  // After the hand-made levels, levels are generated forever from a seed.
  function rng(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function levelAt(i) {
    if (i < LEVELS.length) {
      const [shape, name, paints, recipe] = LEVELS[i];
      return { shape, name, paints, recipe };
    }
    const r = rng(777 + i * 131);
    const keys = Object.keys(PAINTS).sort(() => r() - 0.5);
    const paints = keys.slice(0, 3 + (r() < 0.5 ? 1 : 0));
    const recipe = {};
    const used = 2 + Math.floor(r() * (paints.length - 1));
    paints.slice(0, used).forEach(k => (recipe[k] = 1 + Math.floor(r() * 3)));
    return { shape: SHAPES[Math.floor(r() * SHAPES.length)], name: MYSTERY[Math.floor(r() * MYSTERY.length)] + ' ' + (i + 1), paints: paints.sort(() => r() - 0.5), recipe };
  }

  let progress = store.get('progress', { level: 0, stars: {} });
  let L, target, drops, history;

  // ---- Target character drawing ----
  const tc = $('target'), tx = tc.getContext('2d');
  function fitCanvas(cv, ctx) {
    const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return [r.width, r.height];
  }
  function face(ctx, x, y, s) {
    for (const dx of [-1, 1]) {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(x + dx * s * 0.32, y, s * 0.2, s * 0.24, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#3a2416';
      ctx.beginPath(); ctx.arc(x + dx * s * 0.3, y + s * 0.04, s * 0.1, 0, 7); ctx.fill();
      ctx.strokeStyle = '#5a3416'; ctx.lineWidth = Math.max(2, s * 0.05);
      ctx.beginPath(); ctx.moveTo(x + dx * s * 0.48, y - s * 0.32); ctx.lineTo(x + dx * s * 0.16, y - s * 0.38); ctx.stroke();
    }
    ctx.strokeStyle = '#3a2416'; ctx.lineWidth = Math.max(2, s * 0.05);
    ctx.beginPath(); ctx.arc(x, y + s * 0.42, s * 0.16, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  }
  function leafAt(ctx, x, y, s, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = '#8bc34a';
    ctx.beginPath(); ctx.ellipse(0, -s * 0.5, s * 0.22, s * 0.5, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
  // Draws the level's character filled with colour c, centred at box.
  function paintShape(tx, w, h, c, box) {
    const base = css(c), dark = shade(c, 0.72), light = shade(c, 1.35);
    const { cx, cy, S } = box;
    const shape = box.shape || L.shape;
    const gloss = (x, y, rx, ry, rot = 0) => { tx.fillStyle = '#ffffff55'; tx.beginPath(); tx.ellipse(x, y, rx, ry, rot, 0, 7); tx.fill(); };
    tx.fillStyle = '#0000001a';
    tx.beginPath(); tx.ellipse(cx, cy + S * 0.95, S * 1.1, S * 0.14, 0, 0, 7); tx.fill();
    tx.fillStyle = base;
    switch (shape) {
      case 'eggplant':
        tx.save(); tx.translate(cx, cy); tx.rotate(-0.12);
        tx.beginPath(); tx.ellipse(-S * 0.35, S * 0.15, S * 0.75, S * 0.6, 0.15, 0, 7); tx.fill();
        tx.beginPath(); tx.ellipse(S * 0.45, -S * 0.15, S * 0.55, S * 0.42, -0.3, 0, 7); tx.fill();
        gloss(-S * 0.45, -S * 0.12, S * 0.4, S * 0.1, -0.1);
        tx.fillStyle = '#9ccc65';
        tx.beginPath(); tx.moveTo(S * 0.7, -S * 0.55); tx.lineTo(S * 1.15, -S * 0.2); tx.lineTo(S * 0.85, 0); tx.lineTo(S * 0.55, -S * 0.1); tx.fill();
        tx.restore();
        face(tx, cx + S * 0.3, cy - S * 0.15, S * 0.45);
        return;
      case 'banana':
        tx.lineCap = 'round'; tx.strokeStyle = base; tx.lineWidth = S * 0.55;
        tx.beginPath(); tx.arc(cx, cy - S * 0.9, S * 1.25, 0.25 * Math.PI, 0.75 * Math.PI); tx.stroke();
        tx.fillStyle = '#6d4c2f'; tx.beginPath(); tx.arc(cx - S * 0.9, cy - S * 0.05, S * 0.09, 0, 7); tx.fill();
        face(tx, cx, cy + S * 0.3, S * 0.4);
        return;
      case 'carrot':
        tx.beginPath(); tx.moveTo(cx - S * 0.45, cy - S * 0.6); tx.quadraticCurveTo(cx, cy - S * 0.8, cx + S * 0.45, cy - S * 0.6); tx.lineTo(cx, cy + S * 0.95); tx.closePath(); tx.fill();
        for (const r of [-0.4, 0, 0.4]) leafAt(tx, cx, cy - S * 0.7, S * 0.7, r);
        face(tx, cx, cy - S * 0.25, S * 0.4);
        return;
      case 'chocolate':
        tx.fillStyle = dark; tx.beginPath(); tx.roundRect(cx - S * 0.8, cy - S * 0.75, S * 1.6, S * 1.5, S * 0.12); tx.fill();
        tx.fillStyle = base;
        for (let i = 0; i < 2; i++) for (let j = 0; j < 3; j++) { tx.beginPath(); tx.roundRect(cx - S * 0.72 + i * S * 0.74, cy - S * 0.67 + j * S * 0.47, S * 0.68, S * 0.4, S * 0.06); tx.fill(); }
        face(tx, cx, cy - S * 0.05, S * 0.45);
        return;
      case 'blossom':
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
          tx.beginPath(); tx.ellipse(cx + Math.cos(a) * S * 0.48, cy + Math.sin(a) * S * 0.48, S * 0.42, S * 0.32, a, 0, 7); tx.fill();
        }
        tx.fillStyle = light; tx.beginPath(); tx.arc(cx, cy, S * 0.38, 0, 7); tx.fill();
        face(tx, cx, cy, S * 0.32);
        return;
      case 'leaf':
        tx.beginPath(); tx.moveTo(cx - S, cy + S * 0.3); tx.quadraticCurveTo(cx - S * 0.2, cy - S * 1.1, cx + S, cy - S * 0.4); tx.quadraticCurveTo(cx + S * 0.2, cy + S * 0.9, cx - S, cy + S * 0.3); tx.fill();
        tx.strokeStyle = dark; tx.lineWidth = 3; tx.beginPath(); tx.moveTo(cx - S, cy + S * 0.3); tx.quadraticCurveTo(cx, cy - S * 0.1, cx + S, cy - S * 0.4); tx.stroke();
        face(tx, cx - S * 0.05, cy + S * 0.05, S * 0.36);
        return;
      case 'grape': case 'blueberry': {
        const pts = shape === 'grape' ? [[0, -0.55], [-0.4, -0.45], [0.4, -0.45], [-0.6, -0.05], [-0.2, -0.05], [0.2, -0.05], [0.6, -0.05], [-0.4, 0.35], [0, 0.35], [0.4, 0.35], [-0.2, 0.72], [0.2, 0.72]]
          : [[-0.45, 0.05], [0.45, 0.05], [0, -0.3]];
        const rr = shape === 'grape' ? 0.26 : 0.48;
        for (const [px, py] of pts) {
          tx.fillStyle = base; tx.beginPath(); tx.arc(cx + px * S, cy + py * S, S * rr, 0, 7); tx.fill();
          tx.strokeStyle = dark; tx.lineWidth = 2; tx.stroke();
          gloss(cx + (px - rr * 0.35) * S, cy + (py - rr * 0.4) * S, S * rr * 0.3, S * rr * 0.18, -0.6);
        }
        if (shape === 'grape') leafAt(tx, cx + S * 0.15, cy - S * 0.8, S * 0.55, 0.9);
        face(tx, cx, cy - S * 0.05, S * 0.36);
        return;
      }
      case 'watermelon':
        tx.fillStyle = '#2e7d32'; tx.beginPath(); tx.arc(cx, cy - S * 0.25, S * 1.05, 0, Math.PI); tx.fill();
        tx.fillStyle = '#e8f5d0'; tx.beginPath(); tx.arc(cx, cy - S * 0.25, S * 0.94, 0, Math.PI); tx.fill();
        tx.fillStyle = base; tx.beginPath(); tx.arc(cx, cy - S * 0.25, S * 0.85, 0, Math.PI); tx.fill();
        tx.fillStyle = '#2a1a12';
        for (const [px, py] of [[-0.5, 0.1], [-0.15, 0.3], [0.2, 0.1], [0.5, 0.25], [0, 0.55]]) { tx.beginPath(); tx.ellipse(cx + px * S, cy + py * S - S * 0.05, S * 0.04, S * 0.07, 0, 0, 7); tx.fill(); }
        face(tx, cx, cy - S * 0.02, S * 0.34);
        return;
      default: {
        // Round fruit: apple, lemon, orange, strawberry, pepper, pumpkin
        tx.beginPath();
        if (shape === 'lemon') tx.ellipse(cx, cy, S * 0.95, S * 0.7, 0, 0, 7);
        else if (shape === 'strawberry') { tx.moveTo(cx, cy + S * 0.95); tx.bezierCurveTo(cx - S * 1.1, cy + S * 0.1, cx - S * 0.9, cy - S * 0.8, cx, cy - S * 0.6); tx.bezierCurveTo(cx + S * 0.9, cy - S * 0.8, cx + S * 1.1, cy + S * 0.1, cx, cy + S * 0.95); }
        else if (shape === 'pumpkin') { tx.ellipse(cx - S * 0.45, cy, S * 0.5, S * 0.75, 0, 0, 7); tx.ellipse(cx + S * 0.45, cy, S * 0.5, S * 0.75, 0, 0, 7); tx.ellipse(cx, cy, S * 0.55, S * 0.8, 0, 0, 7); }
        else if (shape === 'pepper') { tx.moveTo(cx, cy - S * 0.6); tx.bezierCurveTo(cx + S * 1.0, cy - S * 0.8, cx + S * 0.9, cy + S * 0.9, cx + S * 0.2, cy + S * 0.85); tx.quadraticCurveTo(cx, cy + S * 0.7, cx - S * 0.2, cy + S * 0.85); tx.bezierCurveTo(cx - S * 0.9, cy + S * 0.9, cx - S * 1.0, cy - S * 0.8, cx, cy - S * 0.6); }
        else { tx.arc(cx - S * 0.3, cy, S * 0.72, 0, 7); tx.arc(cx + S * 0.3, cy, S * 0.72, 0, 7); }
        tx.fill();
        if (shape === 'pumpkin') { tx.strokeStyle = dark; tx.lineWidth = 3; for (const k of [-0.25, 0.25]) { tx.beginPath(); tx.ellipse(cx + k * S, cy, S * 0.25, S * 0.78, 0, 0, 7); tx.stroke(); } }
        if (shape === 'strawberry') { tx.fillStyle = '#fff3b0'; for (let i = 0; i < 14; i++) { const a = i * 2.4, d = (i % 4) * 0.18 + 0.15; tx.beginPath(); tx.ellipse(cx + Math.cos(a) * d * S, cy + S * 0.1 + Math.sin(a) * d * S * 0.9, 3, 4.5, 0, 0, 7); tx.fill(); } }
        gloss(cx - S * 0.45, cy - S * 0.35, S * 0.22, S * 0.12, -0.5);
        tx.fillStyle = '#6d4c2f'; tx.fillRect(cx - 3, cy - S * 0.95, 6, S * 0.3);
        if (shape !== 'lemon') leafAt(tx, cx + S * 0.08, cy - S * 0.7, S * 0.5, 1.0);
        face(tx, cx, cy + S * 0.05, S * 0.42);
      }
    }
  }

  // ---- Painting the character ----
  // Like the real colour-match games, you mix on the palette and then brush
  // the mix onto the blank character. The painted area always shows the
  // palette's current mix; the target colour sits on a small card.
  let cov = null, covCtx = null, objMask = null, coverage = 0, lastCovCheck = 0;
  const BLANK = [228, 222, 214];
  const targetBox = (w, h) => ({ cx: w / 2 + Math.min(w * 0.06, 22), cy: h / 2 + 6, S: Math.min(w * 0.33, h * 0.42) });
  function offscreen(w, h) {
    const c = document.createElement('canvas'), dpr = window.devicePixelRatio || 1;
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    const x = c.getContext('2d');
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    return [c, x];
  }
  function resetObject() {
    const r = tc.getBoundingClientRect();
    [cov, covCtx] = offscreen(r.width, r.height);
    const [m, mx] = offscreen(r.width, r.height);
    paintShape(mx, r.width, r.height, [0, 0, 0], targetBox(r.width, r.height));
    objMask = m;
    coverage = 0;
  }
  function measureCoverage() {
    const N = 64, a = document.createElement('canvas');
    a.width = a.height = N;
    const ax = a.getContext('2d');
    ax.drawImage(objMask, 0, 0, N, N);
    const mask = ax.getImageData(0, 0, N, N).data;
    ax.clearRect(0, 0, N, N);
    ax.drawImage(cov, 0, 0, N, N);
    const paint = ax.getImageData(0, 0, N, N).data;
    let inside = 0, painted = 0;
    for (let i = 3; i < mask.length; i += 4) if (mask[i] > 128) { inside++; if (paint[i] > 128) painted++; }
    coverage = inside ? painted / inside : 0;
  }
  function drawTarget() {
    const [w, h] = fitCanvas(tc, tx);
    tx.clearRect(0, 0, w, h);
    const box = targetBox(w, h);
    paintShape(tx, w, h, BLANK, box);
    const m = mix(well);
    if (m && cov) {
      const [c, cx2] = offscreen(w, h);
      paintShape(cx2, w, h, m, box);
      cx2.setTransform(1, 0, 0, 1, 0, 0);
      cx2.globalCompositeOperation = 'destination-in';
      cx2.drawImage(cov, 0, 0);
      tx.drawImage(c, 0, 0, w, h);
    }
    // Target card in the corner
    const cw = Math.min(104, w * 0.27), ch = cw * 1.02, x0 = 8, y0 = 6;
    tx.fillStyle = '#00000022'; tx.beginPath(); tx.roundRect(x0 + 2, y0 + 4, cw, ch, 12); tx.fill();
    tx.fillStyle = '#fffaf2'; tx.beginPath(); tx.roundRect(x0, y0, cw, ch, 12); tx.fill();
    paintShape(tx, w, h, target, { cx: x0 + cw / 2, cy: y0 + ch * 0.48, S: cw * 0.3 });
    tx.fillStyle = '#3a2e28'; tx.font = '800 12px system-ui, sans-serif'; tx.textAlign = 'center';
    tx.fillText('目標顏色', x0 + cw / 2, y0 + ch - 8);
  }

  // ---- Brush and palette ----
  // Hold anywhere to pick up the brush and drag it. Resting it in a paint tin
  // loads it (the longer, the more, up to a full brush); the water cup washes
  // it. Brushing across the palette well lays paint down: the further you
  // brush, the more comes off. The whole well always shows the one true mix
  // of everything in it; brushing only leaves a fading sheen of strokes.
  const pc = $('paint'), px = pc.getContext('2d');
  const LOAD_RATE = 1.4;     // brush loads per second while resting in a tin
  const DEPOSIT = 1 / 240;   // loads put down per pixel brushed in the well
  const WELL_CAP = 12;
  let well = {}, brush = {}, layer, lctx, held = false, tip = null, lastPt = null, overKey = null, rects = [], tilt = 0;
  const amount = m => Object.values(m).reduce((a, b) => a + b, 0);

  function wellGeom() {
    const r = pc.getBoundingClientRect();
    return { w: r.width, h: r.height, cx: r.width / 2, cy: r.height / 2, rx: r.width * 0.36, ry: r.height * 0.36 };
  }
  function resetLayer() {
    const g = wellGeom(), dpr = window.devicePixelRatio || 1;
    layer = document.createElement('canvas');
    layer.width = Math.round(g.w * dpr); layer.height = Math.round(g.h * dpr);
    lctx = layer.getContext('2d');
    lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function clipWell(ctx, g) { ctx.beginPath(); ctx.ellipse(g.cx, g.cy, g.rx, g.ry, 0, 0, 7); ctx.clip(); }

  function drawPaint() {
    const [w, h] = fitCanvas(pc, px);
    const g = wellGeom();
    px.clearRect(0, 0, w, h);
    // Ceramic palette with a deep mixing well and little side cups
    px.fillStyle = '#00000022';
    px.beginPath(); px.ellipse(g.cx + 4, g.cy + 10, w * 0.48, h * 0.44, 0, 0, 7); px.fill();
    const dish = px.createLinearGradient(0, 0, 0, h);
    dish.addColorStop(0, '#ffffff'); dish.addColorStop(1, '#e9e6e1');
    px.fillStyle = dish;
    px.beginPath(); px.ellipse(g.cx, g.cy, w * 0.48, h * 0.44, 0, 0, 7); px.fill();
    const inner = px.createRadialGradient(g.cx, g.cy - g.ry * 0.3, g.rx * 0.2, g.cx, g.cy, g.rx * 1.05);
    inner.addColorStop(0, '#fbfaf8'); inner.addColorStop(1, '#dcd7d0');
    px.fillStyle = inner;
    px.beginPath(); px.ellipse(g.cx, g.cy, g.rx, g.ry, 0, 0, 7); px.fill();
    const m = mix(well);
    if (m) {
      px.save();
      clipWell(px, g);
      const wet = px.createRadialGradient(g.cx - g.rx * 0.3, g.cy - g.ry * 0.4, g.rx * 0.1, g.cx, g.cy, g.rx * 1.1);
      wet.addColorStop(0, shade(m, 1.12)); wet.addColorStop(0.6, css(m)); wet.addColorStop(1, shade(m, 0.88));
      px.fillStyle = wet;
      px.fillRect(0, 0, w, h);
      px.restore();
    }
    if (layer) px.drawImage(layer, 0, 0, w, h);
    px.strokeStyle = '#cfc9c1'; px.lineWidth = 2;
    px.beginPath(); px.ellipse(g.cx, g.cy, g.rx, g.ry, 0, 0, 7); px.stroke();
    if (!amount(well)) {
      px.fillStyle = '#8a7c70aa'; px.font = '700 14px system-ui, sans-serif'; px.textAlign = 'center';
      px.fillText('按住拖曳畫筆：先沾顏料，', g.cx, g.cy - 8);
      px.fillText('再到這裡來回刷', g.cx, g.cy + 14);
    }
  }

  function syncUI() {
    const total = amount(brush), c = mix(brush);
    $('brushPaint').style.height = Math.round(Math.min(1, total) * 40) + 'px';
    $('brushPaint').style.background = c ? css(c) : 'transparent';
    $('loadTxt').textContent = total < 0.02 ? '乾淨' : `${Math.round(total * 100)}%`;
    $('amountTxt').textContent = amount(well).toFixed(1);
    const t = amount(well);
    $('mixbar').innerHTML = t ? Object.entries(well).filter(([, v]) => v > 0.005).map(([k, v]) => `<i style="width:${(v / t) * 100}%;background:${css(PAINTS[k][1])}"></i>`).join('') : '';
    $('covTxt').textContent = Math.round(coverage * 100) + '%';
    // Live match meter (like trycolors.com): rises as the mix gets closer.
    const m = mix(well), pct = m ? similarity(m, target) : 0;
    $('meterFill').style.width = pct + '%';
    $('meterFill').style.background = pct >= 90 ? '#3ddc84' : pct >= 60 ? '#ffc93c' : '#ff8a6a';
    $('meterTxt').textContent = m ? `相似度 ${pct}%${pct >= 99 ? '　完美！' : pct >= 90 ? '　可以過關了' : ''}` : '相似度 --';
    $('btnDone').disabled = t < 0.3 || coverage < 0.5;
    $('btnClear').disabled = !t;
  }

  function renderBuckets() {
    $('buckets').innerHTML = L.paints.map(k => `<div class="bucket" data-k="${k}">
      <div class="tin"><div class="top"><i style="background:${css(PAINTS[k][1])}"></i></div><div class="label" style="background:${css(PAINTS[k][1])}"></div></div>
      <div class="name">${PAINTS[k][0]}</div></div>`).join('') +
      `<div class="bucket water" data-k="water"><div class="tin"><div class="top"><i></i></div></div><div class="name">洗筆水</div></div>`;
  }

  // Hit areas are measured when a drag starts (the layout doesn't move mid-drag).
  function measure() {
    rects = [...document.querySelectorAll('.bucket')].map(el => ({ k: el.dataset.k, el, r: el.querySelector('.tin').getBoundingClientRect() }));
  }
  function hit(x, y) {
    for (const { k, el, r } of rects) if (x >= r.left - 4 && x <= r.right + 4 && y >= r.top - 18 && y <= r.bottom) return { k, el };
    const pr = pc.getBoundingClientRect(), g = wellGeom();
    const dx = (x - pr.left - g.cx) / g.rx, dy = (y - pr.top - g.cy) / g.ry;
    if (dx * dx + dy * dy <= 1) return { k: 'well' };
    return null;
  }
  function placeBrush(x, y) {
    $('brush').style.transform = `translate(${x - 13}px, ${y - 118}px) rotate(${tilt}deg)`;
  }

  function brushMove(x, y) {
    if (lastPt) tilt = Math.max(-25, Math.min(25, tilt * 0.8 + (x - lastPt.x) * 0.9));
    placeBrush(x, y);
    const h = hit(x, y);
    overKey = h ? h.k : null;
    document.querySelectorAll('.bucket.dip').forEach(b => b.classList.remove('dip'));
    if (h && h.el) h.el.classList.add('dip');
    const tr = tc.getBoundingClientRect();
    if (held && !h && lastPt && x >= tr.left && x <= tr.right && y >= tr.top && y <= tr.bottom) {
      if (!amount(well)) flash('先在調色盤刷出顏色，再來幫角色上色');
      else {
        const box = targetBox(tr.width, tr.height);
        covCtx.strokeStyle = '#fff';
        covCtx.lineCap = 'round';
        covCtx.lineWidth = box.S * 0.38;
        covCtx.beginPath(); covCtx.moveTo(lastPt.x - tr.left, lastPt.y - tr.top); covCtx.lineTo(x - tr.left, y - tr.top); covCtx.stroke();
        const now = performance.now();
        if (now - lastCovCheck > 120) { lastCovCheck = now; measureCoverage(); }
        drawTarget();
      }
    }
    if (held && h && h.k === 'well' && lastPt) {
      const pr = pc.getBoundingClientRect();
      const d = Math.hypot(x - lastPt.x, y - lastPt.y);
      const g = wellGeom();
      const load = amount(brush);
      const room = WELL_CAP - amount(well);
      const put = Math.min(load, d * DEPOSIT, Math.max(0, room));
      lctx.save();
      clipWell(lctx, g);
      lctx.lineCap = 'round';
      if (put > 0) {
        for (const k of Object.keys(brush)) {
          const part = put * (brush[k] / load);
          brush[k] -= part;
          well[k] = (well[k] || 0) + part;
          if (brush[k] < 1e-4) delete brush[k];
        }
      } else if (room <= 0 && load > 0) flash('調色盤滿了，按「清洗調色盤」重來');
      // Strokes are only a glossy sheen over the single mixed colour, and
      // older strokes fade as you keep brushing.
      if (amount(well)) {
        lctx.globalCompositeOperation = 'destination-out';
        lctx.globalAlpha = Math.min(0.3, d * 0.003);
        lctx.fillRect(0, 0, g.w, g.h);
        lctx.globalCompositeOperation = 'source-over';
        lctx.globalAlpha = 1;
        lctx.strokeStyle = 'rgba(255,255,255,0.22)';
        lctx.lineWidth = 16 + Math.min(1, load) * 10;
        lctx.beginPath(); lctx.moveTo(lastPt.x - pr.left, lastPt.y - pr.top); lctx.lineTo(x - pr.left, y - pr.top); lctx.stroke();
        lctx.strokeStyle = 'rgba(0,0,0,0.10)';
        lctx.lineWidth = 3;
        lctx.beginPath(); lctx.moveTo(lastPt.x - pr.left + 6, lastPt.y - pr.top + 5); lctx.lineTo(x - pr.left + 6, y - pr.top + 5); lctx.stroke();
      }
      lctx.restore();
      drawPaint();
      if (coverage > 0) drawTarget();
    }
    lastPt = { x, y };
    syncUI();
  }

  // Loading and washing happen over time while the brush rests in a tin.
  let lastT = 0;
  function tick(t) {
    const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
    lastT = t;
    if (held && overKey && overKey !== 'well') {
      if (overKey === 'water') {
        for (const k of Object.keys(brush)) { brush[k] *= Math.exp(-4 * dt); if (brush[k] < 0.01) delete brush[k]; }
      } else {
        const room = 1 - amount(brush);
        if (room > 0) brush[overKey] = (brush[overKey] || 0) + Math.min(room, LOAD_RATE * dt);
      }
      syncUI();
    }
    requestAnimationFrame(tick);
  }

  let flashTimer;
  function flash(t) {
    $('info').dataset.msg = t;
    $('info').firstChild.textContent = t + '　';
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => ($('info').firstChild.textContent = '筆刷 '), 1500);
  }

  document.addEventListener('pointerdown', ev => {
    if (ev.target.closest('button, .overlay, nav, header')) return;
    held = true;
    measure();
    lastPt = null;
    brushMove(ev.clientX, ev.clientY);
  });
  document.addEventListener('pointermove', ev => { if (held) brushMove(ev.clientX, ev.clientY); });
  const release = () => {
    if (held && cov) { measureCoverage(); syncUI(); }
    held = false;
    lastPt = null;
    document.querySelectorAll('.bucket.dip').forEach(b => b.classList.remove('dip'));
  };
  document.addEventListener('pointerup', release);
  document.addEventListener('pointercancel', release);

  function restBrush() {
    const r = pc.getBoundingClientRect();
    tilt = 18;
    placeBrush(r.right - 18, r.bottom - 6);
  }

  function load(i) {
    progress.level = i;
    store.set('progress', progress);
    L = levelAt(i);
    target = mix(L.recipe);
    well = {};
    brush = {};
    $('lvlName').textContent = `第 ${i + 1} 關・${L.name}`;
    renderBuckets();
    resetObject();
    drawTarget();
    resetLayer();
    drawPaint();
    syncUI();
    restBrush();
    $('box').classList.remove('show');
  }

  function finish() {
    const c = mix(well);
    const pct = similarity(c, target);
    const stars = pct >= 99 ? 3 : pct >= 95 ? 2 : pct >= PASS ? 1 : 0;
    if (stars) {
      progress.stars[progress.level] = Math.max(progress.stars[progress.level] || 0, stars);
      store.set('progress', progress);
      // Keep the best version of each finished work for the gallery.
      const works = store.get('works', {});
      const prev = works[progress.level];
      if (!prev || pct >= prev.pct) works[progress.level] = { c, pct, name: L.name, shape: L.shape };
      store.set('works', works);
    }
    $('boxCard').innerHTML = `<h2>${stars ? (stars === 3 ? '完美配色！' : '配對成功！') : '還差一點'}</h2>
      <div class="pct" style="color:${stars ? '#2e9e57' : '#e0574a'}">${pct}%</div>
      <div class="stars">${stars ? '★'.repeat(stars) + '☆'.repeat(3 - stars) : ''}</div>
      <div class="swatches"><div><span style="background:${css(target)}"></span><small>目標</small></div><div><span style="background:${css(c)}"></span><small>你的顏色</small></div></div>
      <p>${stars ? (stars < 3 ? `達到 99% 可拿三星。` : '一模一樣！') : `需要 ${PASS}% 才算過關。${hint(c)}`}</p>
      <div class="row"><button id="bTune">繼續調整</button>${stars ? '<button class="primary" id="bNext">下一關</button>' : ''}</div>`;
    $('box').classList.add('show');
    $('bTune').onclick = () => $('box').classList.remove('show');
    if (stars) $('bNext').onclick = () => load(progress.level + 1);
  }
  // A gentle nudge: lighter/darker, then which hue is off.
  function hint(c) {
    const [l1, a1, b1] = lab(c), [l2, a2, b2] = lab(target);
    if (l1 - l2 > 8) return '你的顏色太亮了。';
    if (l2 - l1 > 8) return '你的顏色太暗了。';
    if (a1 - a2 > 8) return '偏紅了一點。';
    if (a2 - a1 > 8) return '偏綠了一點。';
    if (b1 - b2 > 8) return '偏黃了一點。';
    if (b2 - b1 > 8) return '偏藍了一點。';
    return '很接近了，再微調看看。';
  }

  // Themed rooms that show off finished works, like Coloring Match's rooms.
  const ROOMS = [
    ['水果展間', ['apple', 'lemon', 'orange', 'strawberry', 'grape', 'banana', 'watermelon', 'blueberry']],
    ['蔬菜展間', ['eggplant', 'pepper', 'carrot', 'pumpkin']],
    ['甜點與花草展間', ['chocolate', 'blossom', 'leaf']],
  ];
  function showGallery() {
    const works = store.get('works', {});
    const all = Array.from({ length: LEVELS.length }, (_, i) => ({ i, ...levelAt(i), w: works[i] }));
    const extra = Object.keys(works).filter(k => +k >= LEVELS.length).length;
    const done = Object.keys(works).length;
    $('boxCard').innerHTML = `<h2>我的展間</h2><p>已收藏 ${done} 件作品${extra ? `（含挑戰關 ${extra} 件）` : ''}。每件都是你親手調出的顏色。</p>` +
      ROOMS.map(([room, shapes]) => {
        const items = all.filter(x => shapes.includes(x.shape));
        return `<div class="room"><h3>${room}　${items.filter(x => x.w).length} / ${items.length}</h3><div class="shelf">${items.map(x =>
          `<div class="work"><canvas data-i="${x.i}"></canvas><b>${x.w ? x.name : '？？？'}</b>${x.w ? x.w.pct + '%' : `第 ${x.i + 1} 關`}</div>`).join('')}</div></div>`;
      }).join('') + '<button id="bClose">關閉</button>';
    $('box').classList.add('show');
    document.querySelectorAll('.work canvas').forEach(cv => {
      const x = all[+cv.dataset.i], ctx2 = cv.getContext('2d');
      const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
      ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
      // Unfinished works show as a blank silhouette.
      paintShape(ctx2, r.width, r.height, x.w ? x.w.c : [205, 197, 188], { cx: r.width / 2, cy: r.height / 2, S: r.width * 0.3, shape: x.shape });
    });
    $('bClose').onclick = () => $('box').classList.remove('show');
  }

  function showLevels() {
    const n = Math.max(LEVELS.length, progress.level + 6);
    $('boxCard').innerHTML = `<h2>選擇關卡</h2><p>前 ${LEVELS.length} 關是精選關卡，之後是無限的挑戰關卡。</p><div id="levels">${Array.from({ length: n }, (_, i) => {
      const s = progress.stars[i] || 0;
      return `<button data-l="${i}" class="${s ? 'done' : ''} ${i === progress.level ? 'cur' : ''}">${i + 1}<small>${'★'.repeat(s)}</small></button>`;
    }).join('')}</div><button id="bClose">關閉</button>`;
    $('box').classList.add('show');
    document.querySelectorAll('[data-l]').forEach(b => (b.onclick = () => load(+b.dataset.l)));
    $('bClose').onclick = () => $('box').classList.remove('show');
  }
  function showHelp() {
    $('boxCard').innerHTML = `<h2>色彩配對</h2><ul class="help">
      <li>左上角卡片是目標顏色，大大的角色等著你上色。</li>
      <li>按住畫面就能拿起畫筆。把筆停在顏料桶裡沾顏料，停越久沾越多（看筆尖和「筆刷 %」）。</li>
      <li>拖到中間的調色盤來回刷，顏料就會刷上去；刷得越多，顏色混得越均勻。下方色條顯示各色比例。</li>
      <li>筆上還有別的顏色時沾新顏料會混在筆上，可以先到「洗筆水」裡停一下洗乾淨。</li>
      <li>調好後，用筆刷在上方的角色身上塗色，塗滿一半以上就能按「比對顏色」。</li>
      <li>調色盤上方的「相似度」會即時顯示離目標還有多遠；想挑戰的話，按右上角「提示」把它關掉。</li>
      <li>左上角的卡片是目標顏色。相似度 90% 以上過關，99% 拿三星；沒過關可以繼續調色，角色身上的顏色會跟著改變。</li>
    </ul><button class="primary" id="bGo" style="max-width:none;width:100%">開始</button>`;
    $('box').classList.add('show');
    $('bGo').onclick = () => { $('box').classList.remove('show'); store.set('seen', true); };
  }

  $('btnClear').onclick = () => { well = {}; resetLayer(); drawPaint(); drawTarget(); syncUI(); };
  $('btnDone').onclick = finish;
  let meterOn = store.get('meter', true);
  const applyMeter = () => { $('meter').classList.toggle('off', !meterOn); $('btnMeter').textContent = `提示：${meterOn ? '開' : '關'}`; };
  $('btnMeter').onclick = () => { meterOn = !meterOn; store.set('meter', meterOn); applyMeter(); };
  applyMeter();
  $('btnLevels').onclick = showLevels;
  $('btnGallery').onclick = showGallery;
  $('btnHelp').onclick = showHelp;
  window.addEventListener('resize', () => { resetObject(); drawTarget(); drawPaint(); restBrush(); syncUI(); });
  window.__color = { mix, similarity, levelAt, state: () => ({ well, brush, target, L }) };

  load(progress.level || 0);
  requestAnimationFrame(tick);
  if (!store.get('seen', false)) showHelp();
})();
</script>
</body>
</html>
