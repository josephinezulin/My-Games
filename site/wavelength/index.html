<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>同頻轉盤</title>
<script>
// 自動更新：部署時 __BUILD__ 會被換成版本號；發現有新版就重新載入一次（遊戲中不打斷）
(function () {
  var B = '__BUILD__';
  try { var u = new URL(location.href); if (u.searchParams.has('r')) { u.searchParams.delete('r'); history.replaceState(null, '', u.pathname + u.search + u.hash); } } catch (e) {}
  if (B.indexOf('__') === 0) return;
  function check() {
    if (window.__wlBusy && window.__wlBusy()) return;
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.v || j.v === B || (window.__wlBusy && window.__wlBusy())) return;
      var k = 'wl:upd:' + j.v;
      try { if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, '1'); } catch (e) { return; }
      var n = new URL(location.href); n.searchParams.set('r', j.v); location.replace(n.toString());
    }).catch(function () {});
  }
  check();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
})();
</script>
<meta name="description" content="同頻轉盤：線上版 Wavelength。一人看答案給線索，其他人轉動指針，猜中越準分數越高。可連線開房，也可以一支手機輪流玩。">
<style>
  /* VOICE  熱鬧的派對桌遊：首頁與設定畫面用文字說清楚，遊戲中盡量用圖示
     IDEA   實體桌遊的半圓轉盤與擋板
     PICTURE 轉盤本身就是主畫面，整頁固定不捲動
     COLOUR 深青底、奶油色盤面、黃橘紅得分區
     LAYOUT 上：首頁、房名、頭像列｜中：遊戲卡｜下：聊天輸入列 */
  :root { --bg: #0e3b3d; --bg2: #13494b; --panel: #fbf4e6; --ink: #1f2a2b; --muted: #6b7778; --line: #e6dcc8;
          --z2: #f4c542; --z3: #f28c38; --z4: #e2483d; --accent: #e2483d; --gold: #f4c542; }
  * { box-sizing: border-box; min-width: 0; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: var(--bg); color: var(--panel); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
         height: var(--app-h, 100dvh); display: flex; flex-direction: column; align-items: center;
         padding-top: env(safe-area-inset-top); -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  input { -webkit-user-select: text; user-select: text; }
  svg { display: block; }
  .hide { display: none !important; }

  /* 上方列 */
  .top { flex: none; width: 100%; max-width: 520px; display: flex; align-items: center; gap: 8px; padding: 8px 12px 6px; }
  .top a.home { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--panel); background: var(--bg2); }
  h1 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: 1px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg2); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 800; white-space: nowrap; letter-spacing: 1px; }
  button.chip { min-height: 40px; color: var(--panel); box-shadow: none; }

  /* 頭像 */
  .face { flex: none; display: grid; place-items: center; border-radius: 50%; color: #fff; font-style: normal; font-weight: 900; line-height: 1; letter-spacing: -1px; overflow: hidden; white-space: nowrap; }
  .face.emo { font-size: 1.15em; letter-spacing: 0; }
  #people { flex: none; width: 100%; max-width: 520px; display: flex; gap: 12px; overflow-x: auto; padding: 14px 14px 8px; scrollbar-width: none; }
  #people::-webkit-scrollbar { display: none; }
  .av { position: relative; flex: none; width: 54px; display: flex; flex-direction: column; align-items: center; gap: 0; text-align: center; background: none; border: 0; border-radius: 0; padding: 0; color: inherit; font: inherit; font-weight: 700; min-height: 0; box-shadow: none; cursor: pointer; }
  .av small { width: 100%; }
  .av:active { transform: none; }
  .av > .face { width: 46px; height: 46px; margin: 0 auto; font-size: 16px; box-shadow: 0 0 0 3px var(--bg); transition: box-shadow .25s, filter .25s, opacity .25s; }
  .av > .face.one { font-size: 20px; }
  .av > .face.emo { font-size: 26px; }
  .av.me > .face { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px #ffffffaa; }
  .av.off > .face { filter: grayscale(1); opacity: .45; }
  .av.off small { opacity: .5; }
  .av small { display: block; font-size: 12px; font-weight: 700; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .av .crown { position: absolute; top: -15px; left: 50%; transform: translateX(-50%) rotate(-8deg); color: var(--gold); filter: drop-shadow(0 1px 0 #0008); }
  .av .crown.drop { animation: crownDrop .6s cubic-bezier(.3,1.4,.5,1) backwards; }
  .av .pen, .av .ok { position: absolute; top: -3px; right: 0; width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg); }
  .av .pen { background: var(--z2); color: var(--ink); }
  .av .ok { background: #3ddc97; color: var(--ink); }
  .av .lost { position: absolute; top: 30px; left: 0; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; box-shadow: 0 0 0 2px var(--bg); }
  .av .sc { position: absolute; top: 31px; right: -2px; min-width: 22px; height: 18px; border-radius: 9px; background: var(--panel); color: var(--ink);
            font-size: 12px; font-weight: 900; line-height: 18px; padding: 0 5px; box-shadow: 0 0 0 2px var(--bg); }
  .pop { animation: pop .35s cubic-bezier(.3,1.5,.5,1) backwards; }
  .bump { animation: bump .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } }
  @keyframes bump { 40% { transform: scale(1.5); } }
  @keyframes crownDrop { from { transform: translate(-50%, -26px) rotate(-30deg); opacity: 0; } }

  /* 舞台：固定高度，不捲動 */
  .stage { position: relative; flex: 1; min-height: 0; width: 100%; max-width: 520px; }
  main { height: 100%; display: flex; flex-direction: column; padding: 2px 12px 10px; overflow: hidden; }
  .card { background: var(--panel); color: var(--ink); border-radius: 20px; padding: 14px; box-shadow: 0 5px 0 #0006; }
  .view { max-height: 100%; display: flex; flex-direction: column; min-height: 0; }
  #gameView { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .scroll-y { overflow-y: auto; min-height: 0; }

  input[type=text] { width: 100%; font-size: 16px; padding: 11px 12px; border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); }
  input[type=text]:focus { outline: none; border-color: var(--z3); }
  button { font: inherit; font-weight: 800; border: 0; border-radius: 12px; padding: 10px 16px; min-height: 44px; cursor: pointer;
           background: var(--accent); color: #fff; box-shadow: 0 3px 0 #0004; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0004; }
  button.ghost { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
  button.small { min-height: 38px; padding: 6px 12px; font-size: 14px; }
  button.icon { width: 44px; padding: 0; flex: none; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--z2); outline-offset: 2px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > input { flex: 1; }
  .intro { margin: 0 0 12px; font-size: 15px; color: var(--muted); font-weight: 700; line-height: 1.5; }
  .lbl { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 900; margin: 14px 0 6px; }
  .lbl small { font-weight: 700; color: var(--muted); font-size: 13px; }
  .hint { margin: 6px 0 0; font-size: 13px; color: var(--muted); font-weight: 700; line-height: 1.5; }
  .vhead { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .vhead h2 { margin: 0; font-size: 19px; font-weight: 900; }
  .vhead button { width: 40px; min-height: 40px; padding: 0; }
  .sect { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 900; margin: 14px 0 8px; }
  .sect::after { content: ""; flex: 1; height: 2px; background: var(--line); border-radius: 1px; }

  /* 加減鈕 */
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 46px; min-height: 46px; padding: 0; background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); font-size: 22px; }
  .stepper output { flex: 1; text-align: center; font-size: 20px; font-weight: 900; }
  .stepper output small { font-size: 14px; color: var(--muted); margin-left: 2px; }
  .seg2 { display: flex; gap: 6px; }
  .seg2 button { flex: 1; min-height: 44px; background: #fff; color: var(--muted); box-shadow: inset 0 0 0 2px var(--line); }
  .seg2 button[aria-pressed=true] { background: var(--ink); color: #fff; box-shadow: none; }
  .ro button:disabled { opacity: 1; } .ro button:disabled[aria-pressed=false] { opacity: .4; }
  .ro .stepper button { visibility: hidden; }

  /* 首頁：公開房間 */
  .rooms { flex: 1; min-height: 64px; overflow-y: auto; margin: 0 -4px; padding: 2px 4px; display: flex; flex-direction: column; gap: 8px; }
  .rooms .none { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #b9ad97; font-weight: 800; font-size: 13px; text-align: center; padding: 6px; }
  button.room { width: 100%; justify-content: flex-start; gap: 10px; background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); padding: 8px 12px; min-height: 58px; text-align: left; }
  .room .nm { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.25; }
  .room .nm b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .room .nm span { font-size: 12px; color: var(--muted); letter-spacing: 2px; }
  .room .faces { display: flex; }
  .room .faces .face { width: 28px; height: 28px; font-size: 11px; margin-left: -7px; box-shadow: 0 0 0 2px #fff; }
  .room .faces .face.emo { font-size: 16px; }
  .room .faces .face:first-child { margin-left: 0; }
  .room .st { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 900; color: var(--muted); white-space: nowrap; }
  .room .st.live { color: var(--accent); }

  /* 大廳（房內等待） */
  #lobbyBox { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; min-height: 0; }
  .roomTitle { text-align: center; font-size: 24px; font-weight: 900; line-height: 1.2; margin-top: 2px; overflow-wrap: anywhere; }
  .mode { display: flex; gap: 8px; justify-content: center; }
  .mode span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 14px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); color: var(--muted); }
  .mode span.on { background: var(--ink); color: #fff; box-shadow: none; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .grid2 .lbl { margin-top: 0; }
  .eq { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 22px; font-weight: 900; color: var(--ink); }
  .eq span { display: inline-flex; align-items: center; gap: 4px; }
  .eq .op { color: var(--muted); font-size: 18px; }
  .wait i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin: 0 2px; animation: blink 1.2s infinite; }
  .wait i:nth-child(2) { animation-delay: .2s; } .wait i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 50% { opacity: .2; } }
  .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  /* 遊戲中 */
  .status { flex: none; display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 14px; color: var(--muted); }
  .prog { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--z3); border-radius: 3px; transition: width .4s; }
  .team, .tmr { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); white-space: nowrap; }
  .tmr.low { color: var(--accent); animation: blink .8s infinite; }
  #playBox { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .wheelbox { position: relative; flex: 1; min-height: 70px; margin-top: 6px; }
  #wheel { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #wheel.drag { cursor: grab; }
  #wheel:focus { outline: none; }
  .ends { flex: none; display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; perspective: 600px; }
  .ends div { flex: 1; display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 16px; padding: 7px 10px; border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); line-height: 1.25; backface-visibility: hidden; }
  .ends div:last-child { justify-content: flex-end; text-align: right; }
  .ends svg { flex: none; color: var(--muted); }
  .ends.flip div { animation: flip .55s cubic-bezier(.3,1.3,.5,1) backwards; }
  .ends.flip div:last-child { animation-delay: .08s; }
  @keyframes flip { from { transform: rotateX(90deg); opacity: .2; } }
  .clue { flex: none; text-align: center; font-size: 22px; font-weight: 900; margin: 8px 0 0; min-height: 32px; overflow-wrap: anywhere; line-height: 1.3; }
  .clue:empty { min-height: 0; margin: 0; }
  .clue.bounce { animation: bounceIn .55s cubic-bezier(.3,1.6,.5,1); }
  @keyframes bounceIn { from { transform: scale(.3) translateY(10px); opacity: 0; } }
  .say { flex: none; display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; font-weight: 800; color: var(--muted); margin: 6px 0 0; font-size: 15px; min-height: 24px; }
  .say .face { width: 24px; height: 24px; font-size: 10px; }
  .say .face.emo { font-size: 14px; }
  #clueForm { flex: none; margin-top: 8px; }
  .res { flex: none; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px; min-height: 36px; }
  .res > div { position: relative; display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); font-weight: 900; }
  .res .face { width: 28px; height: 28px; font-size: 11px; }
  .res .face.emo { font-size: 16px; }
  .res > div.zero { opacity: .5; }
  .res svg { flex: none; color: #c48a12; }
  .res > .bonus { box-shadow: none; padding: 6px 12px; }
  .bonus { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; padding: 2px 8px; border-radius: 999px; background: var(--z2); color: var(--ink); font-size: 13px; animation: burst .6s cubic-bezier(.3,1.7,.5,1) backwards; }
  .bonus.perfect { background: var(--accent); color: #fff; }
  @keyframes burst { 0% { transform: scale(0) rotate(-20deg); } 60% { transform: scale(1.3) rotate(6deg); } }
  #actBox { flex: none; margin-top: 8px; min-height: 0; }
  .fly { position: fixed; z-index: 30; font-weight: 900; font-size: 20px; color: #fff; background: var(--accent); border-radius: 999px; padding: 2px 10px; pointer-events: none; box-shadow: 0 4px 10px #0006; }

  /* 結算 */
  #endBox { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .winner { flex: none; text-align: center; font-size: 30px; font-weight: 900; line-height: 1.2; min-height: 40px; margin-top: 4px; opacity: 0; }
  .winner small { display: block; font-size: 15px; color: var(--muted); }
  .podium-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 118px; }
  .podium { flex: 1; min-height: 90px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 4px; }
  .pcol { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
  .pcol .who { position: absolute; left: 50%; bottom: calc(var(--h) + 6px); transform: translateX(-50%); text-align: center; opacity: 0; width: 100%; }
  .pcol .who .face { width: 54px; height: 54px; margin: 0 auto; font-size: 18px; box-shadow: 0 0 0 3px #fff; }
  .pcol .who .face.emo { font-size: 30px; }
  .pcol.first .who .face { width: 64px; height: 64px; font-size: 22px; box-shadow: 0 0 0 3px #fff, 0 0 0 7px var(--gold); }
  .pcol.first .who .face.emo { font-size: 36px; }
  .pcol .who small { display: block; font-weight: 800; font-size: 13px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcol .crown { position: absolute; top: -28px; left: 50%; color: var(--gold); opacity: 0; filter: drop-shadow(0 2px 0 #0004); }
  .pcol .bar { height: var(--h); width: 100%; border-radius: 12px 12px 4px 4px; display: flex; flex-direction: column; align-items: center; padding-top: 8px; color: #fff; font-weight: 900; transform-origin: bottom; transform: scaleY(0); }
  .pcol .bar b { font-size: 26px; line-height: 1; }
  .pcol .bar span { display: inline-flex; align-items: center; gap: 3px; font-size: 15px; margin-top: 4px; }
  .pcol.first .bar { background: linear-gradient(#f4c542, #e0a51e); color: var(--ink); }
  .pcol.second .bar { background: linear-gradient(#b8c4c9, #8fa0a8); }
  .pcol.third .bar { background: linear-gradient(#e09a62, #c0703a); }
  .rest { flex: none; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .rest div { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; }
  .rest .face { width: 26px; height: 26px; font-size: 10px; }
  .coopEnd { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .coopEnd .big { font-size: 56px; font-weight: 900; line-height: 1; }
  .coopEnd .stars { display: flex; gap: 6px; color: var(--line); }
  .coopEnd .stars svg.on { color: var(--gold); }
  .againBtn { flex: none; margin: 10px auto 0; opacity: 0; position: relative; z-index: 4; }
  .shown { animation: fadeIn .4s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes grow { to { transform: scaleY(1); } }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 16px) scale(.8); } to { opacity: 1; transform: translateX(-50%); } }
  @keyframes crown { 0% { opacity: 0; transform: translate(-50%, -60px) rotate(-30deg); } 70% { opacity: 1; transform: translate(-50%, 4px) rotate(6deg); } 100% { opacity: 1; transform: translate(-50%, 0) rotate(-6deg); } }
  @keyframes zoom { from { opacity: 0; transform: scale(.4); } 70% { transform: scale(1.1); } to { opacity: 1; transform: scale(1); } }
  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
  .confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; }

  /* 底部輸入列 */
  #chatBar { flex: none; width: 100%; max-width: 520px; display: flex; gap: 8px; align-items: center; position: relative; z-index: 8;
             padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: var(--bg); box-shadow: 0 -1px 0 #ffffff1f; }
  #chatBar input { flex: 1; border-color: transparent; }
  #chatBar .send { width: 48px; padding: 0; flex: none; }
  #chatOpen { position: relative; flex: none; width: 46px; padding: 0; background: var(--bg2); box-shadow: none; transition: background .2s, color .2s; }
  #chatOpen[aria-expanded=true] { background: var(--z2); color: var(--ink); }
  #badge { position: absolute; top: -5px; right: -5px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--accent); color: #fff;
           font-size: 12px; line-height: 20px; text-align: center; padding: 0 5px; box-shadow: 0 0 0 2px var(--bg); }

  /* 浮動視窗：聊天、彈窗 */
  #scrim { position: absolute; inset: 0; z-index: 6; background: #061b1c99; opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s; }
  .win { position: absolute; left: 10px; right: 10px; z-index: 7; background: var(--panel); color: var(--ink); border-radius: 22px; box-shadow: 0 18px 40px #000a;
         display: flex; flex-direction: column; overflow: hidden; opacity: 0; visibility: hidden; transform: translateY(30px) scale(.6);
         transition: transform .34s cubic-bezier(.2, .9, .3, 1.15), opacity .2s, visibility 0s .34s; }
  .win.on { transform: none; opacity: 1; visibility: visible; transition: transform .38s cubic-bezier(.2, .9, .3, 1.15), opacity .2s; }
  .scrim-on #scrim { opacity: 1; visibility: visible; transition: opacity .25s; }
  #chatWin { top: 4px; bottom: 10px; transform-origin: 24px calc(100% + 30px); }
  #modal { top: 50%; max-height: calc(100% - 20px); transform-origin: 50% 50%; transform: translateY(-50%) scale(.7); }
  #modal.on { transform: translateY(-50%); }
  .xbtn { position: absolute; top: 10px; right: 10px; z-index: 1; width: 40px; height: 40px; min-height: 0; padding: 0; border-radius: 50%; background: var(--ink); color: #fff; box-shadow: none; }
  #modalBody { padding: 18px 16px 16px; overflow-y: auto; }
  #modalBody h3 { margin: 0 48px 12px 0; font-size: 18px; font-weight: 900; }

// ---------- 正式連線：MQTT 中繼為主（兩台伺服器同時用），P2P 直連為備援 ----------
// 每則訊息同時送進所有線路，收到重複的用「最後寫入為準」去重；任何一條通就能玩。
const DEV = ['localhost', '127.0.0.1'].includes(location.hostname);
const BROKERS = DEV && params.get('brokers') ? params.get('brokers').split(',') : ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const MQTT_SRC = DEV && params.get('mqttsrc') ? params.get('mqttsrc') : 'https://cdn.jsdelivr.net/npm/mqtt@5.16.1/dist/mqtt.esm.js';
const b64 = u8 => btoa(String.fromCharCode(...u8));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function relayJoin(code) {
  const enc = new TextEncoder(), dec = new TextDecoder();
  const hash = [...new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode('wl-jz:' + code)))].map(b => b.toString(16).padStart(2, '0')).join('');
  const base = 'wl-jz/v1/' + hash.slice(0, 20);
  const raw = await crypto.subtle.importKey('raw', enc.encode('wavelength:' + code), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: enc.encode('wl-jz-salt'), iterations: 50000, hash: 'SHA-256' }, raw, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  const seal = async obj => { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)))); return b64(iv) + '.' + b64(ct); };
  const open = async str => { try { const [iv, ct] = String(str).split('.'); return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(iv) }, key, unb64(ct)))); } catch { return null; } };

  let uid = null;
  // 身分記在瀏覽器：同一個瀏覽器回到同一房會恢復座位；不同瀏覽器或無痕視窗視為不同座位
  try { uid = localStorage.getItem('wl:uid:' + code); } catch {}
  if (!uid) { uid = 'u' + Math.random().toString(36).slice(2, 10); try { localStorage.setItem('wl:uid:' + code, uid); } catch {} }

  // 本地資料：共享狀態、每人狀態、在線名單
  const S = {}, U = {}, sl = {}, ul = {}, jl = [], ll = [], el = [];
  const heard = {}, gone = {}, online = new Set();
  let clock = 0;
  const tick = () => (clock = Math.max(Date.now(), clock + 1));
  const newer = (a, b) => !b || a.ts > b.ts || (a.ts === b.ts && a.by > b.by);
  const applyS = (ns, rec) => { if (!rec || typeof rec.ts !== 'number') return; clock = Math.max(clock, rec.ts); if (newer(rec, S[ns])) { S[ns] = rec; (sl[ns] || []).forEach(f => f(rec.val, { userId: rec.by })); } };
  const applyU = (ns, id, rec) => { if (!rec || typeof rec.ts !== 'number') return; clock = Math.max(clock, rec.ts); U[ns] ??= {}; if (newer(rec, U[ns][id])) { U[ns][id] = rec; (ul[ns] || []).forEach(f => f(rec.val, { userId: id, self: id === uid })); } };
  function sweep() {
    const now = Date.now();
    for (const id of Object.keys(heard)) {
      const isOn = id !== uid && !gone[id] && now - heard[id] < 45000;
      if (isOn && !online.has(id)) { online.add(id); jl.forEach(f => f({ userId: id })); }
      if (!isOn && online.has(id)) { online.delete(id); ll.forEach(f => f({ userId: id })); }
    }
  }
  function seen(id, on = true) { if (!id || id === uid) return; heard[id] = Date.now(); gone[id] = !on; sweep(); }
  function handle(m) {
    if (!m || typeof m !== 'object') return;
    if (m.k === 'p') return seen(m.id, !!m.on);
    if (m.k === 's') { seen(m.rec && m.rec.by); return applyS(m.ns, m.rec); }
    if (m.k === 'u') { seen(m.id); return applyU(m.ns, m.id, m.rec); }
    if (m.k === 'hi') { seen(m.id); p2pDump(); }
  }

  // --- MQTT 線路 ---
  const clients = [];
  let mqttLib = null;
  mqttLib = await getMqtt();
  const willMsg = await seal({ k: 'p', id: uid, on: 0 });
  const emitErr = code => el.forEach(f => f({ code }));
  if (mqttLib) for (const url of BROKERS) {
    const c = mqttLib.connect(url, { keepalive: 20, reconnectPeriod: 2500, connectTimeout: 8000, clean: true,
      clientId: 'wl_' + uid + '_' + Math.random().toString(36).slice(2, 6),
      will: { topic: `${base}/p/${uid}`, payload: willMsg, retain: true, qos: 0 } });
    c.on('connect', async () => {
      c.subscribe(base + '/#', { qos: 0 });
      c.publish(`${base}/p/${uid}`, await seal({ k: 'p', id: uid, on: 1 }), { retain: true });
      for (const ns in U) if (U[ns][uid]) c.publish(`${base}/u/${uid}/${ns}`, await seal({ k: 'u', ns, id: uid, rec: U[ns][uid] }), { retain: true });
      // 伺服器若重啟會遺失保留資料，重連時把手上最新的共享狀態補回去（較舊的會被自動忽略）
      for (const ns in S) c.publish(`${base}/s/${ns}`, await seal({ k: 's', ns, rec: S[ns] }), { retain: true });
      changed();
    });
    c.on('message', async (topic, payload) => handle(await open(payload.toString())));
    c.on('offline', () => { emitErr('relay-offline'); changed(); });
    c.on('close', changed);
    c.on('error', () => emitErr('relay-error'));

  }

  // --- P2P 線路（備援，載入失敗也不影響） ---
  let p2pSend = null, p2pPeers = 0;
  async function p2pDump() {
    if (!p2pSend) return;
    for (const ns in S) p2pSend(await seal({ k: 's', ns, rec: S[ns] }));
    for (const ns in U) if (U[ns][uid]) p2pSend(await seal({ k: 'u', ns, id: uid, rec: U[ns][uid] }));
  }
  if (!params.has('nop2p')) (async () => {
    try {
      const { joinRoom } = await import('https://cdn.jsdelivr.net/npm/trystero@0.27.0/+esm');
      const r = p2pRoom = joinRoom({ appId: 'josephinezulin.github.io/my-games/wavelength', password: 'wl-' + code }, code);
      const act = r.makeAction('m');
      p2pSend = data => { try { act.send(data); } catch {} };
      act.onMessage(async data => handle(await open(data)));
      r.onPeerJoin(async () => { p2pPeers++; changed(); p2pSend(await seal({ k: 'hi', id: uid })); p2pDump(); });
      r.onPeerLeave(() => { p2pPeers = Math.max(0, p2pPeers - 1); changed(); });
      r.onError(() => {});
    } catch (e) { console.warn('p2p unavailable', e); }
  })();

  async function broadcast(topic, obj, retain) {
    const data = await seal(obj);
    for (const c of clients) if (c.connected) c.publish(topic, data, { retain, qos: 0 });
    if (p2pSend) p2pSend(data);
  }
  const statusL = [];
  function changed() { statusL.forEach(f => f()); }
  // 心跳：讓其他人知道我還在
  const timers = [setInterval(() => { broadcast(`${base}/p/${uid}`, { k: 'p', id: uid, on: 1 }, true); sweep(); }, 15000), setInterval(sweep, 5000)];
  let p2pRoom = null;
  addEventListener('pagehide', () => { broadcast(`${base}/p/${uid}`, { k: 'p', id: uid, on: 0 }, true); });

  // 等第一台伺服器連上（最多 8 秒），讓保留的遊戲狀態先送到
  await new Promise(res => {
    if (!clients.length) return res();
    const t = setTimeout(res, 8000);
    clients.forEach(c => c.once('connect', () => setTimeout(() => { clearTimeout(t); res(); }, 600)));
  });

  return {
    getSelf: async () => ({ userId: uid }),
    async leave() { timers.forEach(clearInterval); await broadcast(`${base}/p/${uid}`, { k: 'p', id: uid, on: 0 }, true); clients.forEach(c => c.end(true)); try { p2pRoom && p2pRoom.leave(); } catch {} },
    getUsers: () => Object.fromEntries([...online].map(k => [k, {}])),
    onUserJoin: f => jl.push(f), onUserLeave: f => ll.push(f), onError: f => el.push(f),
    onStatus: f => statusL.push(f),
    status: () => ({ relays: relayUp(), relayTotal: clients.length, p2p: p2pPeers }),
    makeState(ns, init) {
      return {
        get: () => (S[ns] ? S[ns].val : init),
        async set(next) {
          const v = typeof next === 'function' ? next(S[ns] ? S[ns].val : init) : next;
          const rec = { val: v, ts: tick(), by: uid }; applyS(ns, rec);
          await broadcast(`${base}/s/${ns}`, { k: 's', ns, rec }, true);
        },
        onChange: f => { (sl[ns] ??= []).push(f); },
      };
    },
    makeUserState(ns, init) {
      return {
        get: (id = uid) => (U[ns]?.[id] ? U[ns][id].val : init),
        getAll: () => Object.fromEntries(Object.entries(U[ns] || {}).map(([k, r]) => [k, r.val])),
        async set(next) {
          const cur = U[ns]?.[uid]?.val ?? init; const v = typeof next === 'function' ? next(cur) : next;
          const rec = { val: v, ts: tick(), by: uid }; applyU(ns, uid, rec);
          await broadcast(`${base}/u/${uid}/${ns}`, { k: 'u', ns, id: uid, rec }, true);
        },
        onChange: f => { (ul[ns] ??= []).push(f); },
      };
    },
  };
}

  lanes[lane] = now + dur * (w + 40) / (W + w);
  if (reduceMotion) { s.style.transform = `translateX(${Math.max(8, (W - w) / 2)}px)`; setTimeout(() => s.remove(), 3500); return; }
  s.animate([{ transform: `translateX(${W}px)` }, { transform: `translateX(${-w - 10}px)` }], { duration: dur, easing: 'linear' }).onfinish = () => s.remove();
}
function renderChat() {
  if (OFF) return;
  const list = chatList();
  if (seen === null) seen = new Set(list.map(m => m.k));
  else for (const m of list) if (!seen.has(m.k)) { seen.add(m.k); if (!chatOpen() && m.t > joinedAt - 3000) { fly(m); if (m.id !== me) setUnread(unread + 1); } }
  const box = $('msgs');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  if (!list.length) { box.replaceChildren(el('div', 'empty', SVG.chat)); return; }
  let prev = null; const map = avatarMap();
  box.replaceChildren(...list.slice(-150).map(m => {
    const row = el('div', 'msg' + (m.id === me ? ' me' : '') + (prev === m.id ? ' cont' : ''));
    prev = m.id;
    const f = faceEl(m.id, map); f.title = nameOf(m.id);
    const p = document.createElement('p'); p.textContent = String(m.x);
    row.append(f, p); return row;
  }));
  if (atBottom || list[list.length - 1].id === me) box.scrollTop = box.scrollHeight;
}
function toggleChat(open) {
  document.body.classList.toggle('chat-on', open);
  document.body.classList.toggle('scrim-on', open || $('modal').classList.contains('on'));
  $('chatWin').classList.toggle('on', open);
  $('chatOpen').setAttribute('aria-expanded', String(open));
  $('chatWin').setAttribute('aria-hidden', String(!open));
  if (open) { setUnread(0); $('danmaku').replaceChildren(); const box = $('msgs'); box.scrollTop = box.scrollHeight; }
}

// ---------- 連線狀態 ----------
let lastErr = 0;
function netState() {
  if (!room || OFF) return { cls: 'idle' };
  const g = G(), peers = online().length - 1;
  const lost = shownIds(g).filter(id => id !== me && !isOn(id));
  const st = room.status ? room.status() : { relays: 1, relayTotal: 1, p2p: 0 };
  const recentErr = Date.now() - lastErr < 15000;
  if (!navigator.onLine) return { cls: 'bad', title: '網路斷了', hint: '檢查 Wi-Fi 或行動網路', fix: true, st };
  if (st.relays === 0 && st.p2p === 0) return { cls: 'bad', title: '連不上伺服器', hint: '正在自動重試，也可以按下面重新連線', fix: true, st };
  if (lost.length) return { cls: 'warn', title: '有人斷線', hint: '灰色頭像的玩家暫時連不上，會自動重連', st };
  if (st.relays < st.relayTotal && recentErr) return { cls: 'warn', title: '線路切換中', hint: '有一條線路斷了，其他線路還在', st };
  if (peers === 0) return { cls: 'idle', title: '等朋友加入', hint: '', st };
  return { cls: '', title: '連線正常', hint: '', st };
}
function renderNet() {
  const st = netState();
  $('netDot').className = 'dot ' + st.cls; $('netDot2').className = 'dot ' + st.cls;
  text($('netTitle'), st.title || ''); text($('netHint'), st.hint || '');
  $('netHint').classList.toggle('hide', !st.hint);
  $('reconnectBtn').classList.toggle('hide', !st.fix);
  if (st.st) $('netLines').replaceChildren(...Array.from({ length: st.st.relayTotal }, (_, i) => el('b', i < st.st.relays ? 'up' : '')), el('b', 'p2p' + (st.st.p2p ? ' up' : '')));
  if (room && !OFF) { const map = avatarMap(); $('netPeers').replaceChildren(...shownIds().map(id => { const f = faceEl(id, map, isOn(id) ? '' : 'lostf'); f.title = nameOf(id); return f; })); }
}
function toggleNet(open) { $('netCard').classList.toggle('on', open); $('roomChip').setAttribute('aria-expanded', String(open)); if (open) renderNet(); }

// ---------- 公開房間：由在線玩家中 id 最小者定時貼簡介 ----------
async function announce(force) {
  if (!room || OFF) return;
  const g = G(), on = online().sort();
  if (on[0] !== me) return;
  lobbyBus = lobbyBus || await lobbyConnect();
  if (!g.pub) { if (lastAnn && lastAnn !== 'off') lobbyBus.publish(code, null); lastAnn = 'off'; return; }
  const map = avatarMap();
  const info = { v: 2, name: clipUnits(g.name || '', NAME_MAX), host: nameOf(g.host || me).slice(0, 12), players: online().slice(0, 10).map(id => ({ n: avOf(id, map), c: colorOf(id) })),
    phase: g.phase, round: g.round, total: g.total, t: Date.now() };
  const sig = JSON.stringify({ ...info, t: 0 });
  if (!force && sig === lastAnn) return;
  lastAnn = sig; lobbyBus.publish(code, info);
}
const lobbyRooms = {};
function renderRooms() {
  const box = $('roomList'); const now = Date.now();
  const list = Object.entries(lobbyRooms).filter(([, i]) => i && now - i.t < 60000 && now - i.t > -60000)
    .sort((a, b) => (a[1].phase === 'lobby' ? 0 : 1) - (b[1].phase === 'lobby' ? 0 : 1) || b[1].t - a[1].t);
  if (!list.length) { box.innerHTML = `<div class="none">${SVG.globe.replace(/18/g, '30')}<span>目前沒有公開房間<br>建立一個公開房間，朋友就能在這裡找到你</span></div>`; return; }
  box.replaceChildren(...list.map(([c, i]) => {
    const b = el('button', 'room');
    const nm = el('span', 'nm'), t1 = el('b'), t2 = el('span');
    t1.textContent = clipUnits(String(i.name || ''), NAME_MAX) || `${String(i.host || '玩家').slice(0, 12)} 的房間`; t2.textContent = c; nm.append(t1, t2);
    const faces = el('span', 'faces');
    const pl = Array.isArray(i.players) ? i.players : [];
    pl.slice(0, 5).forEach(p => { const v = String((p && p.n) || '?').slice(0, 4); const f = el('i', 'face' + (isEmoji(v) ? ' emo' : '')); f.textContent = v; f.style.background = isEmoji(v) ? '#fff6e6' : (COLORS.includes(p && p.c) ? p.c : COLORS[7]); faces.append(f); });
    const st = el('span', 'st' + (i.phase && i.phase !== 'lobby' ? ' live' : ''));
    st.innerHTML = (pl.length >= 3 ? SVG.pk : SVG.coop);
    if (i.phase === 'lobby') st.append(` ${pl.length}`);
    else st.append(` ${Number(i.round) || 0}/${Number(i.total) || 0}`);
    b.append(nm, faces, st);
    b.setAttribute('aria-label', `加入 ${t1.textContent}`);
    b.onclick = () => enter(c);
    return b;
  }));
}

// ---------- 進出房間 ----------
function newCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; return Array.from({ length: 4 }, () => A[Math.floor(Math.random() * A.length)]).join(''); }
function hashCode() { const h = location.hash.slice(1).toUpperCase(); return /^[A-Z0-9]{4,6}$/.test(h) ? h : ''; }
function roomLink() { return location.href.split('#')[0] + '#' + code; }
function kickOut(msg) {
  try { sessionStorage.setItem('wl:msg', msg); } catch {}
  const r = room; room = null;
  Promise.resolve(r && r.leave && r.leave()).finally(() => location.replace(location.pathname + location.search));
}
const tabBus = 'BroadcastChannel' in window ? new BroadcastChannel('wl-tab') : null;
if (tabBus) tabBus.onmessage = ({ data: m }) => {
  if (!room || OFF || params.has('local') || !m || m.code !== code || m.tab === tabId) return;
  // 同一個瀏覽器在別的分頁打開了同一個座位：這邊讓出
  const r = room; room = null; try { r.leave(); } catch {}
  const h = el('h3'); h.textContent = '已在其他分頁開啟';
  const p = el('p', 'hint'); p.textContent = '同一個瀏覽器只能用一個分頁坐同一個位子。';
  const b = el('button', '', '在這裡繼續'); b.style.width = '100%'; b.style.marginTop = '12px';
  b.onclick = () => { try { sessionStorage.setItem('wl:auto', code); } catch {} location.reload(); };
  openModal([h, p, b]);
};

async function enter(c, cfg) {
  const name = $('nameIn').value.trim();
  if (!name) { showView('homeView'); $('nameIn').focus(); $('nameIn').animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'none' }], { duration: 250, iterations: 2 }); return; }
  store.set('wl:name', name);
  code = c; OFF = false;
  if (location.hash.slice(1) !== c) history.replaceState(null, '', '#' + c);
  $('joinErr').innerHTML = '<span class="eq"><span class="wait"><i></i><i></i><i></i></span></span>';
  try { room = await connect(code); } catch (e) { room = null; text($('joinErr'), '連線元件載入失敗，請檢查網路'); return; }
  if (tabBus && !params.has('local')) tabBus.postMessage({ code, tab: tabId });
  me = (await room.getSelf()).userId;
  joinedAt = Date.now();
  game = room.makeState('game', initialGame);
  dial = room.makeState('dial', 90);
  profile = room.makeUserState('profile', { name });
  chat = room.makeUserState('chat', []);
  guessSt = room.makeUserState('guess', null);
  const old = profile.get(me);
  await profile.set({ name, av: old && old.name === name ? old.av || '' : '' });
  game.onChange(render); guessSt.onChange(render);
  dial.onChange(() => { if (!dragging && G().psychic === me) renderWheel(); });
  profile.onChange(() => { render(); renderChat(); }); chat.onChange(renderChat);
  if (room.onStatus) room.onStatus(renderNet);
  room.onUserJoin(() => { render(); renderNet(); }); room.onUserLeave(() => { render(); renderNet(); });
  room.onError(() => { lastErr = Date.now(); renderNet(); });
  setInterval(renderNet, 3000);
  addEventListener('online', renderNet); addEventListener('offline', renderNet);
  text($('roomCode'), code); text($('joinErr'), '');
  showView('gameView'); render(); renderChat(); renderNet();
  if (cfg) await game.set(p => (p && p.host ? p : { ...initialGame, ...(p || {}), host: me, ...cfg }));
  setInterval(() => announce(true), 20000);
  addEventListener('pagehide', () => { if (room && G().pub && online().length <= 1 && lobbyBus) lobbyBus.publish(code, null); });
  setTimeout(() => { kickSeen = G().kicked && G().kicked[me]; kickArmed = true; if (banned(G(), me)) kickOut('你已被房主封鎖，無法再進入這個房間'); }, 1200);
}

// ---------- 離線模式 ----------
let offResumeData = null;
function offlineInit(saved) {
  const resume = !!saved;
  OFF = true; code = 'OFFLINE'; me = null;
  room = offlineRoom(saved);
  game = room.makeState('game', initialGame);
  dial = room.makeState('dial', 90);
  profile = room.makeUserState('profile', null);
  chat = room.makeUserState('chat', []);
  guessSt = room.makeUserState('guess', null);
  game.onChange(render); guessSt.onChange(render); profile.onChange(render);
  if (!resume) {
    const prevPlayers = (() => { try { return JSON.parse(store.get('wl:offPlayers') || '[]'); } catch { return []; } })();
    prevPlayers.slice(0, 8).forEach(p => room.addPlayer('p' + Math.random().toString(36).slice(2, 8), p));
    game.set({ ...initialGame, per: wantPer, custom: (() => { try { return JSON.parse(store.get('wl:offCards') || '[]'); } catch { return []; } })() });
  }
  render();
}
function savedOffline() { try { const s = JSON.parse(store.get('wl:offline') || 'null'); return s && s.S && s.S.game && ['clue', 'guess', 'reveal'].includes(s.S.game.phase) ? s : null; } catch { return null; } }
function renderOffline() {
  const g = G(), ids = room.players(), map = avatarMap();
  text($('offCount'), `${ids.length} / 8`);
  $('offPlayers').replaceChildren(...ids.map(id => {
    const row = el('div', 'pl'), ab = el('button', 'avbtn'); ab.type = 'button'; ab.setAttribute('aria-label', `更換 ${nameOf(id)} 的頭像`);
    ab.append(faceEl(id, map)); ab.onclick = () => openAvatarPicker(id, v => room.addPlayer(id, { ...profile.get(id), av: v }));
    const nm = el('b'); nm.textContent = nameOf(id);
    const rm = el('button', 'rm', '✕'); rm.type = 'button'; rm.setAttribute('aria-label', `移除 ${nameOf(id)}`); rm.onclick = () => { room.removePlayer(id); saveOffPlayers(); };
    row.append(ab, nm, rm); return row;
  }));
  if (!ids.length) { const p = el('p', 'hint'); p.textContent = '先加入至少 2 位玩家。2 人是合作模式，3 人以上是對戰模式。'; $('offPlayers').append(p); }
  stepper($('offPer'), PERS, g.per || 2, fmtPer, true, v => { store.set('wl:per', String(v)); game.set(p => ({ ...p, per: v })); });
  $('offCards').innerHTML = SVG.cards + `<span>自訂題目${(g.custom || []).length ? `・${g.custom.length} 題` : ''}</span>`;
  $('offStart').disabled = ids.length < 2;
  $('offAdd').disabled = ids.length >= 8;
  $('offResume').classList.toggle('hide', !offResumeData);
}
function saveOffPlayers() { store.set('wl:offPlayers', JSON.stringify(room.players().map(id => profile.get(id)))); }
// 輪到誰操作：出題者 → 猜題者一個一個 → 大家一起看揭曉
function needActor(g) {
  if (g.phase === 'clue') return g.psychic;
  if (g.phase === 'guess') { const locked = lockedOf(g); return g.order.find(id => id !== g.psychic && !locked.includes(id)) || null; }
  return null;
}
function renderHandoff(g) {
  const who = needActor(g), box = $('handoff');
  if (!who || who === me) { box.classList.add('hide'); return; }
  const map = avatarMap();
  box.replaceChildren();
  const p1 = el('p'); p1.textContent = '把手機交給';
  const h = el('h2'); h.textContent = nameOf(who);
  const role = el('span', 'role', who === g.psychic ? SVG.pen(15) + '出題' : SVG.lock + '猜題');
  const b = el('button', '', `我是 ${esc(nameOf(who))}`);
  b.onclick = () => { me = who; localDial = 90; dialKey = ''; box.classList.add('hide'); render(); };
  box.append(faceEl(who, map), p1, h, role, b);
  box.classList.remove('hide');
}

// ---------- 首頁 ----------
$('nameIn').value = store.get('wl:name') || '';
function showJoin() {
  const h = hashCode();
  $('newBox').classList.toggle('hide', !!h);
  $('hashBox').classList.toggle('hide', !h);
  text($('hashCode'), h);
}
lobbyConnect().then(bus => { lobbyBus = bus; bus.on((c, info) => { if (!/^[A-Z0-9]{4,6}$/.test(c)) return; if (info && typeof info === 'object' && typeof info.t === 'number') lobbyRooms[c] = info; else delete lobbyRooms[c]; if (!room) renderRooms(); }); });
setInterval(() => { if (!room) renderRooms(); }, 10000);
renderRooms();
showJoin();
try { const msg = sessionStorage.getItem('wl:msg'); sessionStorage.removeItem('wl:msg'); if (msg) text($('joinErr'), msg); } catch {}
try { const auto = sessionStorage.getItem('wl:auto'); sessionStorage.removeItem('wl:auto'); if (auto && auto === hashCode() && $('nameIn').value.trim()) setTimeout(() => enter(auto), 0); } catch {}

// 建立房間畫面
function drawCreate() {
  privSeg($('privPick'), wantPub, true, v => { wantPub = v; store.set('wl:pub', v ? '1' : '0'); drawCreate(); });
  text($('privHint'), wantPub ? '公開：房間會出現在首頁的公開房間列表，任何人都能點進來。' : '私人：不會出現在列表上，只有拿到 4 碼房號或邀請連結的人能進來。');
  stepper($('perPick'), PERS, wantPer, fmtPer, true, v => { wantPer = v; store.set('wl:per', String(v)); drawCreate(); });
  stepper($('timerPick'), TIMERS, wantTimer, fmtTimer, true, v => { wantTimer = v; store.set('wl:timer', String(v)); drawCreate(); });
  text($('roomNameCount'), `${Math.ceil(units($('roomNameIn').value) / 2)} / 8`);
}
$('roomNameIn').addEventListener('input', () => { const v = clipUnits($('roomNameIn').value, NAME_MAX); if (v !== $('roomNameIn').value) $('roomNameIn').value = v; drawCreate(); });
$('toCreate').onclick = () => { if (!$('nameIn').value.trim()) { $('nameIn').focus(); return; } showView('createView'); drawCreate(); };
$('toOffline').onclick = () => { offResumeData = savedOffline(); offlineInit(null); };
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => { if (OFF) { room = null; OFF = false; game = null; } showView('homeView'); setTitle(); });
$('createBtn').onclick = () => enter(newCode(), { per: wantPer, pub: wantPub, timer: wantTimer, name: clipUnits($('roomNameIn').value.trim(), NAME_MAX) });
$('joinCodeBtn').onclick = () => { const c = $('codeIn').value.trim().toUpperCase(); if (!/^[A-Z0-9]{4,6}$/.test(c)) { $('codeIn').focus(); return; } enter(c); };
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('joinCodeBtn').click(); });
$('joinHashBtn').onclick = () => enter(hashCode());
$('otherBtn').onclick = () => { history.replaceState(null, '', location.pathname + location.search); showJoin(); };

// 離線設定畫面
$('offAdd').onclick = () => {
  const n = $('offName').value.trim(); if (!n || room.players().length >= 8) { $('offName').focus(); return; }
  room.addPlayer('p' + Math.random().toString(36).slice(2, 8), { name: n.slice(0, 12), av: '' });
  $('offName').value = ''; $('offName').focus(); saveOffPlayers();
};
$('offName').addEventListener('keydown', e => { if (e.key === 'Enter') $('offAdd').click(); });
$('offStart').onclick = () => { store.set('wl:offCards', JSON.stringify(G().custom || [])); me = null; startGame(); };
$('offResume').onclick = () => { const d = offResumeData; offResumeData = null; if (d) offlineInit(d); };
$('offCards').onclick = () => openCards(true, () => G(), async patch => { await game.set(p => ({ ...p, ...patch })); store.set('wl:offCards', JSON.stringify(G().custom || [])); });

// 房內
$('startBtn').onclick = startGame;
$('cardsBtn').onclick = () => openCards(isHost(), () => G(), patch => game.set(p => ({ ...p, ...patch })));
$('clueBtn').addEventListener('pointerdown', e => { e.preventDefault(); sendClue(); });
$('clueBtn').onclick = e => { if (e.detail === 0) sendClue(); };
$('clueIn').addEventListener('keydown', e => { if (e.key === 'Enter') sendClue(); });
$('clueIn').addEventListener('focus', () => document.body.classList.add('typing'));
$('clueIn').addEventListener('blur', () => document.body.classList.remove('typing'));
$('chatIn').addEventListener('focus', () => document.body.classList.add('chatting'));
$('chatIn').addEventListener('blur', () => document.body.classList.remove('chatting'));
$('copyBtn').onclick = async () => {
  const lbl = $('copyBtn').querySelector('span');
  try { await navigator.clipboard.writeText(roomLink()); lbl.textContent = '已複製連結'; }
  catch { lbl.textContent = code; }
  setTimeout(() => { lbl.textContent = '邀請'; }, 2000);
};
$('chatBar').addEventListener('submit', async e => {
  e.preventDefault();
  const x = $('chatIn').value.trim();
  if (!x || !chat || OFF) return;
  $('chatIn').value = '';
  await chat.set(prev => [...(prev || []), { t: Date.now(), x }].slice(-40));
});
$('chatOpen').onclick = () => toggleChat(!chatOpen());
$('chatClose').onclick = () => toggleChat(false);
$('modalClose').onclick = closeModal;
$('scrim').onclick = () => { if ($('modal').classList.contains('on')) closeModal(); else toggleChat(false); };
addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('modal').classList.contains('on')) closeModal(); else if (chatOpen()) toggleChat(false); } });
$('roomChip').onclick = e => { e.stopPropagation(); toggleNet(!$('netCard').classList.contains('on')); };
document.addEventListener('pointerdown', e => { if ($('netCard').classList.contains('on') && !e.target.closest('#netCard, #roomChip')) toggleNet(false); });
$('reconnectBtn').onclick = () => { try { sessionStorage.setItem('wl:auto', code); } catch {} location.reload(); };
setInterval(tick, 500);

// 手機鍵盤彈出時，讓整個版面貼齊可見區域
const vv = window.visualViewport;
function fitViewport() {
  const h = vv ? vv.height : innerHeight;
  document.documentElement.style.setProperty('--app-h', h + 'px');
  if (vv) { window.scrollTo(0, 0); document.body.style.transform = vv.offsetTop ? `translateY(${vv.offsetTop}px)` : ''; }
}
if (vv) { vv.addEventListener('resize', fitViewport); vv.addEventListener('scroll', fitViewport); }
addEventListener('resize', fitViewport);
fitViewport();

const wheel = $('wheel');
wheel.addEventListener('pointerdown', e => { if (!canDrag()) return; dragging = true; wheel.setPointerCapture(e.pointerId); pushDial(angleFromEvent(e)); });
wheel.addEventListener('pointermove', e => { if (dragging) pushDial(angleFromEvent(e)); });
const endDrag = () => { if (!dragging) return; dragging = false; if (G().mode === 'coop' && !OFF) dial.set(Math.round(localDial)); };
wheel.addEventListener('pointerup', endDrag); wheel.addEventListener('pointercancel', endDrag);
wheel.addEventListener('keydown', e => {
  if (!canDrag()) return;
  const d = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0;
  if (d) { e.preventDefault(); pushDial(clamp(localDial + d * (e.shiftKey ? 5 : 1), 0, 180)); }
});
addEventListener('hashchange', () => { if (!room) showJoin(); });
showView('homeView');
window.__wlBusy = () => !!room;
if (DEV) window.__wl = { game: () => game, G: () => G(), me: () => me, avatarMap: () => avatarMap(), seq: () => seq };
}
