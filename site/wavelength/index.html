<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<title>同頻轉盤</title>
<meta name="description" content="同頻轉盤：線上版 Wavelength。一人看答案給線索，其他人轉動指針，猜中越準分數越高，附聊天室。">
<style>
  /* VOICE  熱鬧的派對桌遊，但介面乾淨
     IDEA   實體桌遊的半圓轉盤與擋板
     PICTURE 轉盤本身就是主畫面
     COLOUR 深青底、奶油色盤面、黃橘紅得分區
     LAYOUT 手機單欄：上方轉盤與操作，下方玩家與聊天室 */
  :root { --bg: #0e3b3d; --bg2: #13494b; --panel: #fbf4e6; --ink: #1f2a2b; --muted: #6b7778; --line: #e6dcc8;
          --z2: #f4c542; --z3: #f28c38; --z4: #e2483d; --accent: #e2483d; --ok: #2f8f6a; }
  * { box-sizing: border-box; min-width: 0; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: var(--bg); color: var(--panel); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
         height: var(--app-h, 100dvh); display: flex; flex-direction: column; align-items: center; overflow-x: clip; }
  nav.games { width: 100%; max-width: 520px; padding: 10px 16px 0; font-size: 14px; display: flex; align-items: center; gap: 10px; }
  nav.games a.home { display: inline-flex; align-items: center; gap: 4px; color: var(--panel); text-decoration: none; font-weight: 700; padding: 6px 8px 6px 2px; }
  header { width: 100%; max-width: 520px; padding: 2px 16px 8px; display: flex; align-items: center; gap: 10px; }
  h1 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: 1px; flex: 1; }
  .chip { background: var(--bg2); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  nav.games, header { flex: none; }
  .stage { position: relative; flex: 1; min-height: 0; width: 100%; max-width: 520px; }
  main { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 12px 16px; display: flex; flex-direction: column; gap: 12px; }

  /* 底部固定輸入列 */
  #chatBar { flex: none; width: 100%; max-width: 520px; display: flex; gap: 8px; align-items: center;
             padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: var(--bg); box-shadow: 0 -1px 0 #ffffff1f; }
  #chatBar input { flex: 1; border-color: transparent; }
  #chatOpen { position: relative; flex: none; width: 46px; padding: 0; display: grid; place-items: center; background: var(--bg2); box-shadow: none; }
  #chatOpen[aria-expanded=true] { background: var(--z2); color: var(--ink); }
  #badge { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--accent); color: #fff;
           font-size: 12px; line-height: 20px; text-align: center; padding: 0 5px; box-shadow: 0 0 0 2px var(--bg); }

  /* 全螢幕聊天室（蓋住遊戲區，輸入列仍在下方） */
  #chatFull { position: absolute; inset: 0; z-index: 5; background: var(--bg); display: flex; flex-direction: column; padding: 0 12px 8px; }
  #chatFull .head { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 8px; }
  #chatFull h2 { margin: 0; font-size: 18px; }
  #chatClose { background: var(--bg2); box-shadow: none; }

  /* 彈幕 */
  #danmaku { position: absolute; inset: 0; z-index: 4; overflow: hidden; pointer-events: none; }
  #danmaku span { position: absolute; left: 0; white-space: nowrap; font-size: 16px; font-weight: 800; padding: 4px 12px; border-radius: 999px;
                  background: #102b2ccc; color: #fff; box-shadow: 0 2px 6px #0005; will-change: transform; }
  #danmaku span b { color: var(--z2); margin-right: 6px; }
  #danmaku span.me { background: #e2483de6; }
  #danmaku span.me b { color: #fff; }
  .card { background: var(--panel); color: var(--ink); border-radius: 18px; padding: 16px; box-shadow: 0 6px 0 #0006; }
  .card h2 { margin: 0 0 10px; font-size: 17px; }
  .muted { color: var(--muted); font-size: 14px; }
  label { display: block; font-size: 14px; font-weight: 700; margin: 10px 0 4px; }
  input[type=text] { width: 100%; font-size: 16px; padding: 11px 12px; border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); }
  input[type=text]:focus { outline: none; border-color: var(--z3); }
  button { font: inherit; font-weight: 800; border: 0; border-radius: 12px; padding: 11px 16px; min-height: 44px; cursor: pointer;
           background: var(--accent); color: #fff; box-shadow: 0 3px 0 #0004; }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0004; }
  button.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
  button.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--z2); outline-offset: 2px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > input { flex: 1; }
  .hide { display: none !important; }

  .status { display: flex; justify-content: space-between; font-weight: 800; font-size: 15px; margin-bottom: 6px; }
  .wheelbox { position: relative; }
  #wheel { width: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  #wheel.drag { cursor: grab; }
  .ends { display: flex; justify-content: space-between; gap: 12px; margin-top: 4px; }
  .ends div { flex: 1; font-weight: 900; font-size: 17px; padding: 8px 10px; border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); }
  .ends div:last-child { text-align: right; }
  .ends small { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
  .clue { text-align: center; font-size: 22px; font-weight: 900; margin: 12px 0 4px; min-height: 33px; overflow-wrap: anywhere; }
  .clue small { display: block; font-size: 13px; color: var(--muted); font-weight: 700; }
  .say { text-align: center; font-weight: 800; color: var(--muted); margin: 6px 0; }
  .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .big { font-size: 40px; font-weight: 900; text-align: center; line-height: 1.1; }
  .pts { text-align: center; font-size: 22px; font-weight: 900; margin-top: 6px; }

  /* 玩家頭像列（固定在上方） */
  #people { flex: none; width: 100%; max-width: 520px; display: flex; gap: 10px; overflow-x: auto; padding: 2px 14px 10px; scrollbar-width: none; }
  #people::-webkit-scrollbar { display: none; }
  .av { position: relative; flex: none; width: 52px; text-align: center; }
  .av i { display: grid; place-items: center; width: 44px; height: 44px; margin: 0 auto; border-radius: 50%; font-style: normal;
          font-size: 19px; font-weight: 900; color: #fff; box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px transparent; }
  .av.me i { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--panel); }
  .av.off { opacity: .35; }
  .av small { display: block; font-size: 12px; font-weight: 700; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .av .bd { position: absolute; top: -3px; right: 0; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg); }
  .av .bd.psy { background: var(--z2); color: var(--ink); }
  .av .bd.ok { background: #3ddc97; color: var(--ink); }
  .av .sc { position: absolute; top: 30px; right: -2px; min-width: 22px; height: 18px; border-radius: 9px; background: var(--panel); color: var(--ink);
            font-size: 12px; font-weight: 900; line-height: 18px; padding: 0 5px; box-shadow: 0 0 0 2px var(--bg); }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; min-height: 44px; padding: 0; background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
  .seg button[aria-pressed=true] { background: var(--ink); color: #fff; box-shadow: none; }
  .seg button:disabled { opacity: 1; }
  .mode { display: flex; gap: 10px; justify-content: center; margin: 10px 0 2px; }
  .mode span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 14px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); color: var(--muted); }
  .mode span.on { background: var(--ink); color: #fff; box-shadow: none; }
  .res { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .res div { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); font-weight: 900; }
  .res div i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-style: normal; font-size: 13px; }
  .res div.zero { opacity: .5; }
  .podium li { align-items: center; }
  .podium li span { display: flex; align-items: center; gap: 8px; }
  .podium li i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-style: normal; font-weight: 900; }
  .players span { background: #fff; box-shadow: inset 0 0 0 2px var(--line); border-radius: 999px; padding: 4px 10px; font-size: 14px; font-weight: 700; }
  .players span.psy { background: var(--z2); box-shadow: none; }
  .players span.off { opacity: .45; }

  #msgs { flex: 1; min-height: 0; overflow-y: auto; background: var(--panel); color: var(--ink); border-radius: 16px; padding: 12px 14px; font-size: 16px; }
  #msgs p { margin: 0 0 6px; overflow-wrap: anywhere; }
  #msgs b { margin-right: 6px; }
  #msgs .me b { color: var(--accent); }
  #msgs .empty { color: var(--muted); text-align: center; margin-top: 30%; }
  .share { word-break: break-all; font-size: 13px; color: var(--muted); }
  .log { font-size: 14px; margin: 8px 0 0; padding: 0; list-style: none; }
  .log li { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding: 5px 0; }
  .log li b { white-space: nowrap; }
  .net { font-size: 13px; text-align: center; color: #cfe3e2; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<nav class="games"><a class="home" href="../" aria-label="回到首頁" title="回到首頁"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h4.5v-5.5h4v5.5h4.5V10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg><span>首頁</span></a></nav>
<header>
  <h1>同頻轉盤</h1>
  <span class="chip hide" id="roomChip"></span>
</header>
<div id="people" class="hide" aria-label="玩家"></div>

<div class="stage">
<main id="main">
  <!-- 進入畫面 -->
  <section class="card" id="joinView">
    <label for="nameIn" style="margin-top:0">暱稱</label>
    <input type="text" id="nameIn" maxlength="12" placeholder="例如：小明" autocomplete="nickname">
    <div id="newBox">
      <label>每人出題次數</label>
      <div class="seg" id="perPick"></div>
      <div class="actions" style="justify-content:stretch;margin-top:14px"><button id="createBtn" style="flex:1">建立房間</button></div>
      <label for="codeIn">加入房號</label>
      <div class="row"><input type="text" id="codeIn" maxlength="6" placeholder="4 碼房號" autocapitalize="characters"><button class="ghost" id="joinCodeBtn">加入</button></div>
    </div>
    <div id="hashBox" class="hide">
      <p class="big" style="font-size:32px;margin:10px 0" id="hashCode"></p>
      <div class="actions" style="justify-content:flex-start"><button id="joinHashBtn">加入</button><button class="ghost" id="otherBtn">開新房間</button></div>
    </div>
    <p class="muted" id="joinErr" role="alert"></p>
  </section>

  <!-- 遊戲畫面 -->
  <section class="card hide" id="gameView">
    <div class="status"><span id="roundTxt"></span><span id="scoreTxt"></span></div>
    <div id="lobbyBox">
      <div class="mode"><span id="mCoop">合作 2 人</span><span id="mPk">對戰 3+ 人</span></div>
      <label>每人出題次數</label>
      <div class="seg" id="perLobby"></div>
      <p class="say" id="startHint"></p>
      <div class="share" id="shareTxt"></div>
      <div class="actions">
        <button class="ghost" id="copyBtn">複製邀請連結</button>
        <button id="startBtn">開始</button>
      </div>
    </div>
    <div id="playBox" class="hide">
      <div class="wheelbox"><svg id="wheel" viewBox="0 0 400 222" role="slider" aria-label="指針" aria-valuemin="0" aria-valuemax="180" tabindex="0"></svg></div>
      <div class="ends"><div id="leftEnd"></div><div id="rightEnd"></div></div>
      <div class="clue" id="clueTxt"></div>
      <p class="say" id="sayTxt"></p>
      <div id="clueForm" class="row hide"><input type="text" id="clueIn" maxlength="30" placeholder="你的線索"><button id="clueBtn">送出</button></div>
      <div class="res hide" id="resBox"></div>
      <div class="actions" id="actBox"></div>
    </div>
    <div id="endBox" class="hide">
      <div class="big" id="finalTxt"></div>
      <p class="pts" id="rankTxt"></p>
      <ul class="log podium" id="podium"></ul>
      <div class="actions"><button id="againBtn">再玩一局</button></div>
    </div>
  </section>

  <p class="net" id="netTxt"></p>
</main>
<div id="danmaku" aria-hidden="true"></div>
<section id="chatFull" class="hide" aria-label="聊天室">
  <div class="head"><h2>聊天室</h2><button class="small" id="chatClose">回到遊戲</button></div>
  <div id="msgs" aria-live="polite"></div>
</section>
</div>
<form id="chatBar" class="hide">
  <button type="button" id="chatOpen" aria-label="打開聊天室" aria-expanded="false"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 5.5h16v10H9.5L5 19.5v-4H4z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg><span id="badge" class="hide"></span></button>
  <input type="text" id="chatIn" maxlength="200" placeholder="說點什麼…" autocomplete="off" enterkeyhint="send">
  <button>送出</button>
</form>

<script src="cards.js"></script>
<script type="module">
{
const $ = id => document.getElementById(id);
const CARDS = window.WL_CARDS;
const CX = 200, CY = 206, R = 186;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const params = new URLSearchParams(location.search);

// ---------- 連線層：正式版用 Trystero（瀏覽器直連），?local 用同瀏覽器分頁模擬 ----------
function mockJoin(code) {
  const bc = new BroadcastChannel('wl-mock-' + code);
  const uid = 'u' + Math.random().toString(36).slice(2, 9);
  const S = {}, U = {}, sl = {}, ul = {}, peers = {}, jl = [], ll = [];
  let clock = 0;
  const ts = () => Math.max(Date.now(), ++clock);
  const post = m => bc.postMessage({ ...m, from: uid });
  const newer = (a, b) => !b || a.ts > b.ts || (a.ts === b.ts && a.by > b.by);
  const applyS = (ns, rec) => { if (newer(rec, S[ns])) { const prev = S[ns]?.val; S[ns] = rec; (sl[ns] || []).forEach(f => f(rec.val, { userId: rec.by, prev })); } };
  const applyU = (ns, id, rec) => { U[ns] ??= {}; if (newer(rec, U[ns][id])) { U[ns][id] = rec; (ul[ns] || []).forEach(f => f(rec.val, { userId: id, self: id === uid })); } };
  const dump = () => { for (const ns in S) post({ t: 's', ns, rec: S[ns] }); for (const ns in U) if (U[ns][uid]) post({ t: 'u', ns, rec: U[ns][uid] }); };
  bc.onmessage = ({ data: m }) => {
    if (m.t === 'bye') { delete peers[m.from]; ll.forEach(f => f({ userId: m.from })); return; }
    if (!peers[m.from]) { peers[m.from] = 1; jl.forEach(f => f({ userId: m.from })); post({ t: 'hi' }); dump(); }
    if (m.t === 's') applyS(m.ns, m.rec);
    if (m.t === 'u') applyU(m.ns, m.from, m.rec);
  };
  addEventListener('pagehide', () => post({ t: 'bye' }));
  setTimeout(() => post({ t: 'hi' }), 50);
  return {
    ready: Promise.resolve(),
    getSelf: async () => ({ userId: uid }),
    getUsers: () => Object.fromEntries(Object.keys(peers).map(k => [k, {}])),
    onUserJoin: f => jl.push(f), onUserLeave: f => ll.push(f), onError: () => {},
    makeState(ns, init) {
      return {
        get: () => (S[ns] ? S[ns].val : init),
        async set(next) { const v = typeof next === 'function' ? next(S[ns] ? S[ns].val : init) : next; const rec = { val: v, ts: ts(), by: uid }; applyS(ns, rec); post({ t: 's', ns, rec }); },
        onChange: f => { (sl[ns] ??= []).push(f); },
      };
    },
    makeUserState(ns, init) {
      const all = () => Object.fromEntries(Object.entries(U[ns] || {}).map(([k, r]) => [k, r.val]));
      return {
        get: (id = uid) => (U[ns]?.[id] ? U[ns][id].val : init),
        getAll: all,
        async set(next) { const cur = U[ns]?.[uid]?.val ?? init; const v = typeof next === 'function' ? next(cur) : next; const rec = { val: v, ts: ts(), by: uid }; applyU(ns, uid, rec); post({ t: 'u', ns, rec }); },
        onChange: f => { (ul[ns] ??= []).push(f); },
      };
    },
  };
}

async function connect(code) {
  if (params.has('local')) return mockJoin(code);
  const { joinRoom } = await import('https://cdn.jsdelivr.net/npm/trystero@0.27.0/+esm');
  return joinRoom({ appId: 'josephinezulin.github.io/my-games/wavelength', password: 'wl-' + code }, code);
}

// ---------- 狀態 ----------
let room, me, code, game, dial, profile, chat, guessSt;
let dragging = false, localDial = 90, lastSend = 0, sendTimer = 0, dialKey = '', wantPer = Number(store.get('wl:per')) || 2, revealing = false;

const initialGame = { phase: 'lobby', host: null, per: 2, mode: 'coop', gid: '', round: 0, total: 0, order: [], psychic: null, card: null, used: [],
  clue: '', target: null, guesses: {}, results: {}, psyPts: 0, score: 0, scores: {}, log: [] };
const COLORS = ['#e2483d', '#2f6fd6', '#2f8f6a', '#8e44ad', '#d97706', '#0f766e', '#be185d', '#475569'];

const online = () => [me, ...Object.keys(room.getUsers()).filter(id => id !== me)];
const nameOf = id => (profile.get(id) || {}).name || '玩家';
const G = () => ({ ...initialGame, ...(game.get() || {}) });
const initial = n => Array.from(n.trim())[0] || '?';
function colorOf(id) {
  const g = G();
  let i = g.order.indexOf(id);
  if (i < 0) { const ids = [...new Set([...g.order, ...online().filter(x => !g.order.includes(x)).sort()])]; i = ids.indexOf(id); }
  return COLORS[Math.max(i, 0) % COLORS.length];
}
const guessersOf = g => online().filter(id => id !== g.psychic);
function lockedOf(g) {
  const all = guessSt.getAll();
  return Object.keys(all).filter(id => id !== g.psychic && all[id] && all[id].gid === g.gid && all[id].r === g.round);
}
const myLock = g => { const x = guessSt.get(me); return x && x.gid === g.gid && x.r === g.round ? x.v : null; };

function pickCard(used) {
  const free = CARDS.map((_, i) => i).filter(i => !used.includes(i));
  const pool = free.length ? free : CARDS.map((_, i) => i);
  return pool[Math.floor(Math.random() * pool.length)];
}
function mySecret(g) {
  const k = `wl:${code}:${g.gid}:${g.round}:${g.card}`;
  let t = Number(store.get(k));
  if (!t) { t = 8 + Math.floor(Math.random() * 165); store.set(k, String(t)); }
  return t;
}
function score(guess, target) {
  const d = Math.abs(guess - target);
  return d <= 4 ? 4 : d <= 12 ? 3 : d <= 20 ? 2 : 0;
}
function rank(s, max) {
  const r = s / max;
  return r >= .75 ? '心靈相通' : r >= .55 ? '默契十足' : r >= .35 ? '還算有默契' : '再多磨合一下';
}

// ---------- 遊戲動作 ----------
async function setPer(n) {
  wantPer = n; store.set('wl:per', String(n));
  await game.set(p => (p.phase === 'lobby' || p.phase === 'end' ? { ...initialGame, ...p, per: n } : p));
}
async function startGame() {
  const order = online().sort();
  if (order.length < 2) return;
  const g0 = G(), per = g0.per || 2, card = pickCard([]);
  await game.set({ ...initialGame, host: g0.host, per, mode: order.length === 2 ? 'coop' : 'pk', gid: Math.random().toString(36).slice(2, 8),
    phase: 'clue', round: 1, total: order.length * per, order, psychic: order[0], card, used: [card],
    scores: Object.fromEntries(order.map(id => [id, 0])) });
  await dial.set(90);
}
async function nextRound() {
  await game.set(p => {
    const g = { ...initialGame, ...p };
    if (!['reveal', 'clue', 'guess'].includes(g.phase)) return p;
    if (g.round >= g.total) return { ...g, phase: 'end' };
    const round = g.round + 1, card = pickCard(g.used);
    return { ...g, phase: 'clue', round, psychic: g.order[(round - 1) % g.order.length], card, used: [...g.used, card],
      clue: '', target: null, guesses: {}, results: {}, psyPts: 0 };
  });
  await dial.set(90);
}
async function rerollCard() {
  await game.set(p => { if (p.phase !== 'clue' || p.psychic !== me) return p; const card = pickCard(p.used); return { ...p, card, used: [...p.used, card] }; });
}
async function sendClue() {
  const clue = $('clueIn').value.trim();
  if (!clue) return;
  $('clueIn').value = '';
  await game.set(p => (p.phase === 'clue' && p.psychic === me ? { ...p, phase: 'guess', clue } : p));
}
async function lockGuess() {
  const g = G(), v = Math.round(localDial);
  if (g.mode === 'coop') await dial.set(v);
  await guessSt.set({ gid: g.gid, r: g.round, v });
}
async function revealIfPsychic(force) {
  const g = G();
  if (g.phase !== 'guess' || g.psychic !== me || revealing) return;
  const locked = lockedOf(g), need = guessersOf(g);
  if (!locked.length || (!force && need.some(id => !locked.includes(id)))) return;
  revealing = true;
  const all = guessSt.getAll(), target = mySecret(g), guesses = {}, results = {};
  for (const id of locked) { guesses[id] = all[id].v; results[id] = score(all[id].v, target); }
  const avg = Math.round(Object.values(results).reduce((a, b) => a + b, 0) / locked.length);
  try {
    await game.set(p => {
      if (p.phase !== 'guess' || p.round !== g.round || p.gid !== g.gid) return p;
      const scores = { ...(p.scores || {}) };
      if (p.mode === 'pk') { for (const id in results) scores[id] = (scores[id] || 0) + results[id]; scores[me] = (scores[me] || 0) + avg; }
      return { ...p, phase: 'reveal', target, guesses, results, psyPts: avg, score: p.score + (p.mode === 'coop' ? avg : 0), scores,
        log: [...p.log, { r: p.round, card: p.card, clue: p.clue, by: p.psychic, pts: avg }] };
    });
  } finally { revealing = false; }
}

// ---------- 轉盤繪製 ----------
const pt = (a, r) => { const t = a * Math.PI / 180; return [CX - r * Math.cos(t), CY - r * Math.sin(t)]; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const f1 = n => n.toFixed(1);
function wedge(a1, a2, r, fill) {
  a1 = clamp(a1, 0, 180); a2 = clamp(a2, 0, 180);
  if (a2 <= a1) return '';
  const [x1, y1] = pt(a1, r), [x2, y2] = pt(a2, r);
  return `<path d="M${CX} ${CY}L${f1(x1)} ${f1(y1)}A${r} ${r} 0 0 1 ${f1(x2)} ${f1(y2)}Z" fill="${fill}"/>`;
}
function zones(t) {
  let s = wedge(t - 20, t + 20, R - 6, 'var(--z2)') + wedge(t - 12, t + 12, R - 6, 'var(--z3)') + wedge(t - 4, t + 4, R - 6, 'var(--z4)');
  [[-16, 2], [-8, 3], [0, 4], [8, 3], [16, 2]].forEach(([o, n]) => {
    const a = t + o; if (a < 2 || a > 178) return;
    const [x, y] = pt(a, R - 30);
    s += `<text x="${f1(x)}" y="${f1(y + 6)}" text-anchor="middle" font-size="17" font-weight="900" fill="#fff">${n}</text>`;
  });
  return s;
}
function needle(v, color, label) {
  const [nx, ny] = pt(v, R - 16);
  let s = `<line x1="${CX}" y1="${CY}" x2="${f1(nx)}" y2="${f1(ny)}" stroke="#1f2a2b" stroke-width="6" stroke-linecap="round"/>`;
  if (label) {
    const [lx, ly] = pt(v, R - 16);
    s += `<circle cx="${f1(lx)}" cy="${f1(ly)}" r="13" fill="${color}" stroke="#1f2a2b" stroke-width="2.5"/><text x="${f1(lx)}" y="${f1(ly + 5)}" text-anchor="middle" font-size="14" font-weight="900" fill="#fff">${label}</text>`;
  } else s += `<circle cx="${f1(nx)}" cy="${f1(ny)}" r="9" fill="${color}" stroke="#1f2a2b" stroke-width="3"/>`;
  return s;
}
function drawWheel(g, showT, needles) {
  const ticks = Array.from({ length: 19 }, (_, i) => { const [x1, y1] = pt(i * 10, R - 2), [x2, y2] = pt(i * 10, R - 10); return `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="#c9bda5" stroke-width="2"/>`; }).join('');
  let s = `<path d="M${CX - R - 8} ${CY}A${R + 8} ${R + 8} 0 0 1 ${CX + R + 8} ${CY}Z" fill="#0a2b2c"/>`;
  s += `<path d="M${CX - R} ${CY}A${R} ${R} 0 0 1 ${CX + R} ${CY}Z" fill="#fbf4e6"/>`;
  if (showT != null) s += zones(showT);
  else s += `<path d="M${CX - R + 6} ${CY}A${R - 6} ${R - 6} 0 0 1 ${CX + R - 6} ${CY}Z" fill="#e8dfcc"/><text x="${CX}" y="${CY - 92}" text-anchor="middle" font-size="40" font-weight="900" fill="#d6cab2">?</text>`;
  s += ticks + needles.map(n => needle(n.v, n.color, n.label)).join('');
  s += `<circle cx="${CX}" cy="${CY}" r="22" fill="#1f2a2b"/><circle cx="${CX}" cy="${CY}" r="9" fill="#e2483d"/>`;
  $('wheel').innerHTML = s;
}
function canDrag() { const g = G(); return g.phase === 'guess' && g.psychic !== me && myLock(g) == null; }
function angleFromEvent(e) {
  const svg = $('wheel'), p = svg.createSVGPoint();
  p.x = e.clientX; p.y = e.clientY;
  const q = p.matrixTransform(svg.getScreenCTM().inverse());
  const th = Math.atan2(Math.max(CY - q.y, 0), q.x - CX) * 180 / Math.PI;
  return clamp(180 - th, 0, 180);
}
function pushDial(v) {
  localDial = v;
  renderWheel();
  if (G().mode !== 'coop') return;
  const now = Date.now();
  clearTimeout(sendTimer);
  if (now - lastSend > 60) { lastSend = now; dial.set(Math.round(v)); }
  else sendTimer = setTimeout(() => { lastSend = Date.now(); dial.set(Math.round(localDial)); }, 70);
}

// ---------- 畫面 ----------
function text(el, s) { el.textContent = s; }
const ICON_EYE = '<svg viewBox="0 0 24 24" width="14" height="14"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>';
const ICON_OK = '<svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function avatarEl(id, cls) {
  const el = document.createElement('i');
  el.style.background = colorOf(id);
  el.textContent = initial(nameOf(id));
  if (cls) el.className = cls;
  return el;
}
function renderPeople() {
  const g = G(), on = online(), inGame = !['lobby', 'end'].includes(g.phase);
  const locked = g.phase === 'guess' ? lockedOf(g) : [];
  const ids = [...new Set([...g.order, ...on])];
  $('people').replaceChildren(...ids.map(id => {
    const d = document.createElement('div');
    d.className = 'av' + (id === me ? ' me' : '') + (on.includes(id) ? '' : ' off');
    d.title = nameOf(id);
    d.append(avatarEl(id));
    const nm = document.createElement('small'); nm.textContent = id === me ? '我' : nameOf(id); d.append(nm);
    if (inGame && id === g.psychic) { const b = document.createElement('span'); b.className = 'bd psy'; b.innerHTML = ICON_EYE; d.append(b); }
    else if (locked.includes(id)) { const b = document.createElement('span'); b.className = 'bd ok'; b.innerHTML = ICON_OK; d.append(b); }
    if (g.mode === 'pk' && g.phase !== 'lobby') { const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = String(g.scores[id] || 0); d.append(sc); }
    return d;
  }));
}
function renderSeg(box, cur, enabled) {
  box.replaceChildren(...[1, 2, 3, 4, 5].map(n => {
    const b = document.createElement('button');
    b.textContent = String(n); b.setAttribute('aria-pressed', String(n === cur));
    b.disabled = !enabled;
    b.onclick = () => (box.id === 'perPick' ? (wantPer = n, store.set('wl:per', String(n)), renderSeg(box, n, true)) : setPer(n));
    return b;
  }));
}
function renderWheel() {
  const g = G(), amPsy = g.psychic === me;
  let showT = null, needles = [];
  if (g.phase === 'reveal') {
    showT = g.target;
    needles = Object.entries(g.guesses).map(([id, v]) => ({ v, color: colorOf(id), label: initial(nameOf(id)) }));
  } else if (amPsy) {
    showT = mySecret(g);
    if (g.phase === 'guess' && g.mode === 'coop') needles = [{ v: dial.get(), color: colorOf(online().find(id => id !== me) || me) }];
  } else if (g.phase === 'guess') {
    const lk = myLock(g);
    needles = [{ v: lk ?? localDial, color: colorOf(me), label: lk != null ? initial(nameOf(me)) : '' }];
  }
  drawWheel(g, showT, needles);
  $('wheel').setAttribute('aria-valuenow', String(Math.round(localDial)));
  $('wheel').classList.toggle('drag', canDrag());
}
function render() {
  if (!room) return;
  const g = G(), amPsy = g.psychic === me, on = online(), n = on.length;
  const inGame = !['lobby', 'end'].includes(g.phase);
  $('lobbyBox').classList.toggle('hide', g.phase !== 'lobby');
  $('playBox').classList.toggle('hide', !inGame);
  $('endBox').classList.toggle('hide', g.phase !== 'end');
  text($('roundTxt'), inGame ? `${g.round} / ${g.total}` : '');
  text($('scoreTxt'), inGame ? (g.mode === 'coop' ? `隊伍 ${g.score} 分` : `我 ${g.scores[me] || 0} 分`) : '');
  renderPeople();

  if (g.phase === 'lobby') {
    $('mCoop').classList.toggle('on', n <= 2); $('mPk').classList.toggle('on', n > 2);
    renderSeg($('perLobby'), g.per || 2, g.host === me || !g.host);
    text($('startHint'), n < 2 ? '等朋友加入…' : `${n} 人 × ${g.per || 2} 題 = ${n * (g.per || 2)} 回合`);
    $('startBtn').disabled = n < 2;
  }
  if (inGame) {
    const key = g.gid + ':' + g.round;
    if (key !== dialKey) { dialKey = key; localDial = 90; }
    const c = CARDS[g.card] || ['', ''];
    text($('leftEnd'), c[0]); text($('rightEnd'), c[1]);
    renderWheel();
    const clue = $('clueTxt'); clue.replaceChildren();
    if (g.clue) clue.append(g.clue);
    $('clueForm').classList.toggle('hide', !(g.phase === 'clue' && amPsy));
    const psyOn = on.includes(g.psychic), locked = lockedOf(g), need = guessersOf(g);
    let say = '';
    if (g.phase === 'clue') say = amPsy ? '給一個線索' : `${nameOf(g.psychic)} 想線索中…`;
    if (g.phase === 'guess') say = amPsy ? `${locked.length} / ${need.length} 已作答` : myLock(g) != null ? `等其他人 ${locked.length} / ${need.length}` : (g.mode === 'pk' ? '拖指針，各自作答' : '拖指針');
    if (!psyOn && !amPsy && g.phase !== 'reveal') say = `${nameOf(g.psychic)} 離線了`;
    text($('sayTxt'), say);
    // 揭曉結果
    const res = $('resBox');
    res.classList.toggle('hide', g.phase !== 'reveal');
    if (g.phase === 'reveal') {
      const chip = (id, pts, psy) => {
        const d = document.createElement('div'); if (!pts) d.className = 'zero';
        d.append(avatarEl(id)); d.append((psy ? '出題 ' : '') + '+' + pts); return d;
      };
      res.replaceChildren(...Object.entries(g.results).map(([id, p]) => chip(id, p)), ...(g.mode === 'pk' ? [chip(g.psychic, g.psyPts, true)] : []));
    }
    const act = $('actBox'); act.replaceChildren();
    const btn = (label, fn, cls) => { const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.onclick = fn; act.append(b); };
    if (g.phase === 'clue' && amPsy) btn('換題', rerollCard, 'ghost small');
    if (g.phase === 'guess' && !amPsy && myLock(g) == null) btn('鎖定', lockGuess);
    if (g.phase === 'guess' && amPsy && locked.length && locked.length < need.length) btn('直接揭曉', () => revealIfPsychic(true), 'ghost small');
    if (g.phase === 'reveal') btn(g.round >= g.total ? '看結果' : '下一題', nextRound);
    if (!psyOn && !amPsy && g.phase !== 'reveal') btn('跳過', nextRound, 'ghost small');
  }
  if (g.phase === 'end') {
    const pod = $('podium');
    if (g.mode === 'coop') {
      text($('finalTxt'), `${g.score} / ${g.total * 4}`);
      text($('rankTxt'), rank(g.score, g.total * 4));
      pod.replaceChildren();
    } else {
      const ranked = [...new Set([...g.order, ...Object.keys(g.scores)])].sort((a, b) => (g.scores[b] || 0) - (g.scores[a] || 0));
      const top = g.scores[ranked[0]] || 0, winners = ranked.filter(id => (g.scores[id] || 0) === top);
      text($('finalTxt'), winners.map(nameOf).join('、'));
      text($('rankTxt'), winners.length > 1 ? '平手' : '冠軍');
      pod.replaceChildren(...ranked.map((id, i) => {
        const li = document.createElement('li'), a = document.createElement('span'), b = document.createElement('b');
        a.append(String(i + 1), avatarEl(id), nameOf(id)); b.textContent = `${g.scores[id] || 0} 分`;
        li.append(a, b); return li;
      }));
    }
    renderSeg($('perLobby'), g.per || 2, true);
  }
  revealIfPsychic(false);
}
let seen = null, joinedAt = Date.now(), unread = 0, lanes = [0, 0, 0, 0, 0];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function chatList() {
  const list = [];
  for (const [id, arr] of Object.entries(chat ? chat.getAll() : {})) for (const m of arr || []) list.push({ ...m, id, k: id + ':' + m.t });
  return list.sort((a, b) => a.t - b.t);
}
function chatOpen() { return !$('chatFull').classList.contains('hide'); }
function setUnread(n) { unread = n; $('badge').classList.toggle('hide', !n); text($('badge'), n > 99 ? '99+' : String(n)); }
function fly(m) {
  const box = $('danmaku'), W = box.clientWidth, H = box.clientHeight;
  const now = Date.now();
  let lane = lanes.indexOf(Math.min(...lanes));
  const free = lanes.findIndex(t => t < now); if (free !== -1) lane = free;
  const el = document.createElement('span'), b = document.createElement('b');
  b.textContent = nameOf(m.id); el.append(b, String(m.x));
  if (m.id === me) el.className = 'me';
  el.style.top = (Math.max(8, H * 0.04) + lane * 40) + 'px';
  box.append(el);
  const w = el.offsetWidth, dur = 6500 + Math.min(String(m.x).length, 40) * 60;
  lanes[lane] = now + dur * (w + 40) / (W + w);
  if (reduceMotion) { el.style.transform = `translateX(${Math.max(8, (W - w) / 2)}px)`; setTimeout(() => el.remove(), 3500); return; }
  const anim = el.animate([{ transform: `translateX(${W}px)` }, { transform: `translateX(${-w - 10}px)` }], { duration: dur, easing: 'linear' });
  anim.onfinish = () => el.remove();
}
function renderChat() {
  const list = chatList();
  if (seen === null) seen = new Set(list.map(m => m.k));
  else for (const m of list) if (!seen.has(m.k)) { seen.add(m.k); if (!chatOpen() && m.t > joinedAt - 3000) { fly(m); if (m.id !== me) setUnread(unread + 1); } }
  const box = $('msgs');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  if (!list.length) { box.innerHTML = '<p class="empty">還沒有訊息，打個招呼吧</p>'; return; }
  box.replaceChildren(...list.slice(-150).map(m => {
    const p = document.createElement('p'), b = document.createElement('b');
    b.textContent = nameOf(m.id);
    if (m.id === me) p.className = 'me';
    p.append(b, String(m.x));
    return p;
  }));
  if (atBottom || list[list.length - 1].id === me) box.scrollTop = box.scrollHeight;
}
function toggleChat(open) {
  $('chatFull').classList.toggle('hide', !open);
  $('chatOpen').setAttribute('aria-expanded', String(open));
  if (open) { setUnread(0); $('danmaku').replaceChildren(); const box = $('msgs'); box.scrollTop = box.scrollHeight; }
}

// ---------- 進房 ----------
function newCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; return Array.from({ length: 4 }, () => A[Math.floor(Math.random() * A.length)]).join(''); }
function hashCode() { const h = location.hash.slice(1).toUpperCase(); return /^[A-Z0-9]{4,6}$/.test(h) ? h : ''; }
function roomLink() { return location.href.split('#')[0] + '#' + code; }

async function enter(c, creating = false) {
  const name = $('nameIn').value.trim();
  if (!name) { text($('joinErr'), '先輸入暱稱'); $('nameIn').focus(); return; }
  store.set('wl:name', name);
  code = c;
  if (location.hash.slice(1) !== c) history.replaceState(null, '', '#' + c);
  text($('joinErr'), '連線中…');
  try { room = await connect(code); } catch (e) { room = null; text($('joinErr'), '連線元件載入失敗，請檢查網路後重新整理。'); return; }
  me = (await room.getSelf()).userId;
  joinedAt = Date.now();
  game = room.makeState('game', initialGame);
  dial = room.makeState('dial', 90);
  profile = room.makeUserState('profile', { name });
  chat = room.makeUserState('chat', []);
  guessSt = room.makeUserState('guess', null);
  await profile.set({ name });
  game.onChange(render); guessSt.onChange(render);
  dial.onChange(() => { if (!dragging && G().psychic === me) renderWheel(); });
  profile.onChange(() => { render(); renderChat(); }); chat.onChange(renderChat);
  room.onUserJoin(() => render()); room.onUserLeave(() => render());
  room.onError(e => text($('netTxt'), '連線問題：' + (e && e.code ? e.code : '請重新整理')));
  $('joinView').classList.add('hide');
  ['gameView', 'people', 'chatBar'].forEach(id => $(id).classList.remove('hide'));
  $('roomChip').classList.remove('hide'); text($('roomChip'), '房號 ' + code);
  text($('shareTxt'), roomLink());
  text($('netTxt'), params.has('local') ? '本機測試模式' : '瀏覽器直連，不經過伺服器。少數公司網路可能連不上，換手機網路試試。');
  render(); renderChat();
  if (creating) await game.set(p => (p && p.host ? p : { ...initialGame, ...(p || {}), host: me, per: wantPer }));
}

$('nameIn').value = store.get('wl:name') || '';
function showJoin() {
  const h = hashCode();
  $('newBox').classList.toggle('hide', !!h);
  $('hashBox').classList.toggle('hide', !h);
  text($('hashCode'), h);
}
showJoin();
$('createBtn').onclick = () => enter(newCode(), true);
renderSeg($('perPick'), wantPer, true);
$('joinCodeBtn').onclick = () => { const c = $('codeIn').value.trim().toUpperCase(); if (!/^[A-Z0-9]{4,6}$/.test(c)) { text($('joinErr'), '房號是 4 碼英數字'); return; } enter(c); };
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('joinCodeBtn').click(); });
$('joinHashBtn').onclick = () => enter(hashCode());
$('otherBtn').onclick = () => { history.replaceState(null, '', location.pathname + location.search); showJoin(); };
$('startBtn').onclick = startGame;
$('againBtn').onclick = async () => { await game.set(p => ({ ...initialGame, host: p.host, per: p.per, phase: 'lobby' })); };
$('clueBtn').onclick = sendClue;
$('clueIn').addEventListener('keydown', e => { if (e.key === 'Enter') sendClue(); });
$('copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(roomLink()); text($('copyBtn'), '已複製'); }
  catch { text($('copyBtn'), '請手動複製上方連結'); }
  setTimeout(() => text($('copyBtn'), '複製邀請連結'), 2000);
};
$('chatBar').addEventListener('submit', async e => {
  e.preventDefault();
  const x = $('chatIn').value.trim();
  if (!x || !chat) return;
  $('chatIn').value = '';
  await chat.set(prev => [...(prev || []), { t: Date.now(), x }].slice(-40));
});

$('chatOpen').onclick = () => toggleChat(!chatOpen());
$('chatClose').onclick = () => toggleChat(false);

// 手機鍵盤彈出時，讓整個版面貼齊可見區域，上下列保持固定
const vv = window.visualViewport;
function fitViewport() {
  const h = vv ? vv.height : innerHeight;
  document.documentElement.style.setProperty('--app-h', h + 'px');
  if (vv) { document.body.style.transform = vv.offsetTop ? `translateY(${vv.offsetTop}px)` : ''; }
}
if (vv) { vv.addEventListener('resize', fitViewport); vv.addEventListener('scroll', fitViewport); }
addEventListener('resize', fitViewport);
fitViewport();

const wheel = $('wheel');
wheel.addEventListener('pointerdown', e => { if (!canDrag()) return; dragging = true; wheel.setPointerCapture(e.pointerId); pushDial(angleFromEvent(e)); });
wheel.addEventListener('pointermove', e => { if (dragging) pushDial(angleFromEvent(e)); });
const endDrag = () => { if (!dragging) return; dragging = false; if (G().mode === 'coop') dial.set(Math.round(localDial)); };
wheel.addEventListener('pointerup', endDrag); wheel.addEventListener('pointercancel', endDrag);
wheel.addEventListener('keydown', e => {
  if (!canDrag()) return;
  const d = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0;
  if (d) { e.preventDefault(); pushDial(clamp(localDial + d * (e.shiftKey ? 5 : 1), 0, 180)); }
});
addEventListener('hashchange', () => { if (!room) showJoin(); });
}
