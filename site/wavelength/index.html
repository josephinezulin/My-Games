<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>同頻轉盤</title>
<meta name="description" content="同頻轉盤：線上版 Wavelength。一人看答案給線索，其他人轉動指針，猜中越準分數越高，附聊天室。">
<style>
  /* VOICE  熱鬧的派對桌遊，介面用圖示說話，文字越少越好
     IDEA   實體桌遊的半圓轉盤與擋板
     PICTURE 轉盤本身就是主畫面，整頁固定不捲動
     COLOUR 深青底、奶油色盤面、黃橘紅得分區
     LAYOUT 上：首頁、房號、頭像列｜中：遊戲卡（轉盤自動縮放）｜下：聊天輸入列 */
  :root { --bg: #0e3b3d; --bg2: #13494b; --panel: #fbf4e6; --ink: #1f2a2b; --muted: #6b7778; --line: #e6dcc8;
          --z2: #f4c542; --z3: #f28c38; --z4: #e2483d; --accent: #e2483d; --gold: #f4c542; }
  * { box-sizing: border-box; min-width: 0; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: var(--bg); color: var(--panel); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
         height: var(--app-h, 100dvh); display: flex; flex-direction: column; align-items: center;
         padding-top: env(safe-area-inset-top); -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  input { -webkit-user-select: text; user-select: text; }
  svg { display: block; }

  /* 上方列 */
  .top { flex: none; width: 100%; max-width: 520px; display: flex; align-items: center; gap: 8px; padding: 8px 12px 6px; }
  .top a.home { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--panel); background: var(--bg2); }
  h1 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: 1px; flex: 1; white-space: nowrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg2); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 800; white-space: nowrap; letter-spacing: 1px; }

  /* 玩家頭像列 */
  #people { flex: none; width: 100%; max-width: 520px; display: flex; gap: 12px; overflow-x: auto; padding: 10px 14px 8px; scrollbar-width: none; }
  #people::-webkit-scrollbar { display: none; }
  .av { position: relative; flex: none; width: 52px; text-align: center; }
  .av > i { display: grid; place-items: center; width: 44px; height: 44px; margin: 0 auto; border-radius: 50%; font-style: normal;
            font-size: 19px; font-weight: 900; color: #fff; box-shadow: 0 0 0 3px var(--bg); transition: box-shadow .25s; }
  .av.me > i { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px #ffffff99; }
  .av.psy > i { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--gold), 0 0 14px 4px #f4c54266; }
  .av.off small { opacity: .5; }
  .av small { display: block; font-size: 12px; font-weight: 700; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .av .crown { position: absolute; top: -13px; left: 50%; transform: translateX(-50%) rotate(-8deg); color: var(--gold); filter: drop-shadow(0 1px 0 #0008); }
  .av .ok { position: absolute; top: -3px; right: 0; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: #3ddc97; color: var(--ink); box-shadow: 0 0 0 2px var(--bg); }
  .av .sc { position: absolute; top: 30px; right: -2px; min-width: 22px; height: 18px; border-radius: 9px; background: var(--panel); color: var(--ink);
            font-size: 12px; font-weight: 900; line-height: 18px; padding: 0 5px; box-shadow: 0 0 0 2px var(--bg); }

  /* 中間舞台：固定高度，不捲動 */
  .stage { position: relative; flex: 1; min-height: 0; width: 100%; max-width: 520px; }
  main { height: 100%; display: flex; flex-direction: column; padding: 2px 12px 10px; }
  .card { background: var(--panel); color: var(--ink); border-radius: 20px; padding: 14px; box-shadow: 0 5px 0 #0006; }
  #gameView { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #joinView { max-height: 100%; display: flex; flex-direction: column; min-height: 0; }
  #gameView, main { overflow: hidden; }

  /* 公開房間列表 */
  .rooms { flex: 1; min-height: 72px; overflow-y: auto; margin: 0 -4px; padding: 2px 4px; display: flex; flex-direction: column; gap: 8px; }
  .rooms .none { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #cbbfa8; font-weight: 800; font-size: 13px; }
  button.room { width: 100%; justify-content: flex-start; gap: 10px; background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); padding: 8px 12px; min-height: 56px; animation: pop .3s backwards; }
  button.room:active { box-shadow: inset 0 0 0 2px var(--z3); }
  .room .code { font-size: 17px; letter-spacing: 2px; font-weight: 900; }
  .room .faces { display: flex; flex: 1; }
  .room .faces i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-style: normal; font-size: 12px; font-weight: 900; margin-left: -6px; box-shadow: 0 0 0 2px #fff; }
  .room .faces i:first-child { margin-left: 0; }
  .room .st { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 900; color: var(--muted); white-space: nowrap; }
  .room .st.live { color: var(--accent); }
  .room .go { color: var(--muted); }
  .sect { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 900; margin: 12px 0 8px; }
  .sect::after { content: ""; flex: 1; height: 2px; background: var(--line); border-radius: 1px; }
  .priv { display: flex; gap: 6px; }
  .priv button { flex: 1; min-height: 44px; background: #fff; color: var(--muted); box-shadow: inset 0 0 0 2px var(--line); }
  .priv button[aria-pressed=true] { background: var(--ink); color: #fff; box-shadow: none; }
  .priv button:disabled { opacity: 1; } .priv button:disabled[aria-pressed=false] { opacity: .45; }

  /* 輸入線索時：只留轉盤和線索框 */
  body.typing #chatBar, body.typing #people, body.typing .top, body.typing .status, body.typing .say, body.typing #actBox, body.typing .clue { display: none !important; }
  body.typing .wheelbox { min-height: 0; }
  body.chatting #people { display: none; }

  input[type=text] { width: 100%; font-size: 16px; padding: 11px 12px; border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); }
  input[type=text]:focus { outline: none; border-color: var(--z3); }
  button { font: inherit; font-weight: 800; border: 0; border-radius: 12px; padding: 10px 16px; min-height: 44px; cursor: pointer;
           background: var(--accent); color: #fff; box-shadow: 0 3px 0 #0004; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0004; }
  button.ghost { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
  button.small { min-height: 38px; padding: 6px 12px; font-size: 14px; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--z2); outline-offset: 2px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > input { flex: 1; }
  .hide { display: none !important; }
  .gap { height: 12px; flex: none; }

  .seg { display: flex; gap: 6px; align-items: center; }
  .seg .ic { flex: none; width: 36px; display: grid; place-items: center; color: var(--muted); }
  .seg button { flex: 1; min-height: 44px; padding: 0; background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
  .seg button[aria-pressed=true] { background: var(--ink); color: #fff; box-shadow: none; }
  .seg button:disabled { opacity: 1; }
  .seg button:disabled[aria-pressed=false] { opacity: .45; }

  /* 大廳 */
  #lobbyBox { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .mode { display: flex; gap: 10px; justify-content: center; }
  .mode span { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; font-weight: 800; font-size: 15px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); color: var(--muted); }
  .mode span.on { background: var(--ink); color: #fff; box-shadow: none; }
  .eq { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 24px; font-weight: 900; color: var(--ink); }
  .eq span { display: inline-flex; align-items: center; gap: 4px; }
  .eq .op { color: var(--muted); font-size: 20px; }
  .eq .wait { font-size: 16px; color: var(--muted); }
  .eq .wait i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin: 0 2px; animation: blink 1.2s infinite; }
  .eq .wait i:nth-child(2) { animation-delay: .2s; } .eq .wait i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 50% { opacity: .2; } }
  .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  /* 遊戲中 */
  .status { flex: none; display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 14px; color: var(--muted); }
  .prog { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--z3); border-radius: 3px; transition: width .4s; }
  .team { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); }
  #playBox { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .wheelbox { position: relative; flex: 1; min-height: 70px; margin-top: 6px; }
  #wheel { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #wheel.drag { cursor: grab; }
  #wheel:focus { outline: none; }
  .ends { flex: none; display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; }
  .ends div { flex: 1; display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 16px; padding: 7px 10px; border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); line-height: 1.25; }
  .ends div:last-child { justify-content: flex-end; text-align: right; }
  .ends svg { flex: none; color: var(--muted); }
  .clue { flex: none; text-align: center; font-size: 22px; font-weight: 900; margin: 8px 0 0; min-height: 32px; overflow-wrap: anywhere; line-height: 1.3; }
  .clue:empty { min-height: 0; margin: 0; }
  .say { flex: none; text-align: center; font-weight: 800; color: var(--muted); margin: 6px 0 0; font-size: 15px; min-height: 22px; }
  #clueForm { flex: none; margin-top: 8px; }
  .res { flex: none; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .res div { display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); font-weight: 900; animation: pop .35s backwards; }
  .res div i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-style: normal; font-size: 13px; }
  .res div.zero { opacity: .5; }
  .res div svg { color: #c99a10; }
  #actBox { flex: none; margin-top: 8px; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }

  /* 結算 */
  #endBox { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .winner { flex: none; text-align: center; font-size: 30px; font-weight: 900; line-height: 1.2; min-height: 40px; margin-top: 4px; }
  .winner small { display: block; font-size: 15px; color: var(--muted); }
  .podium { flex: 1; min-height: 150px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; padding: 0 4px; }
  .pcol { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .pcol .who { position: relative; text-align: center; margin-bottom: 6px; opacity: 0; }
  .pcol .who i { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 50%; margin: 0 auto; color: #fff; font-style: normal; font-size: 22px; font-weight: 900; box-shadow: 0 0 0 3px #fff; }
  .pcol.first .who i { width: 64px; height: 64px; font-size: 26px; box-shadow: 0 0 0 3px #fff, 0 0 0 7px var(--gold); }
  .pcol .who small { display: block; font-weight: 800; font-size: 13px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; }
  .pcol .crown { position: absolute; top: -26px; left: 50%; color: var(--gold); opacity: 0; filter: drop-shadow(0 2px 0 #0004); }
  .pcol .bar { width: 100%; border-radius: 12px 12px 4px 4px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 8px; color: #fff; font-weight: 900; transform-origin: bottom; transform: scaleY(0); }
  .pcol .bar b { font-size: 26px; line-height: 1; }
  .pcol .bar span { display: inline-flex; align-items: center; gap: 3px; font-size: 15px; opacity: .95; margin-top: 4px; }
  .pcol.first .bar { height: 100%; background: linear-gradient(#f4c542, #e0a51e); color: var(--ink); }
  .pcol.second .bar { height: 72%; background: linear-gradient(#b8c4c9, #8fa0a8); }
  .pcol.third .bar { height: 52%; background: linear-gradient(#e09a62, #c0703a); }
  .podium-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 30px; }
  .rest { flex: none; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .rest div { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; }
  .rest i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-style: normal; font-size: 12px; }
  .coopEnd { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .coopEnd .big { font-size: 56px; font-weight: 900; line-height: 1; }
  .coopEnd .stars { display: flex; gap: 6px; color: var(--line); }
  .coopEnd .stars svg.on { color: var(--gold); }
  #againBtn { flex: none; margin: 10px auto 0; opacity: 0; position: relative; z-index: 4; }
  .shown { animation: fadeIn .4s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes grow { to { transform: scaleY(1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.8); } to { opacity: 1; transform: none; } }
  @keyframes crown { 0% { opacity: 0; transform: translate(-50%, -60px) rotate(-30deg); } 70% { opacity: 1; transform: translate(-50%, 4px) rotate(6deg); } 100% { opacity: 1; transform: translate(-50%, 0) rotate(-6deg); } }
  @keyframes zoom { from { opacity: 0; transform: scale(.4); } 70% { transform: scale(1.1); } to { opacity: 1; transform: scale(1); } }
  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
  .confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; }

  /* 底部輸入列 */
  #chatBar { flex: none; width: 100%; max-width: 520px; display: flex; gap: 8px; align-items: center; position: relative; z-index: 8;
             padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: var(--bg); box-shadow: 0 -1px 0 #ffffff1f; }
  #chatBar input { flex: 1; border-color: transparent; }
  #chatBar .send { width: 48px; padding: 0; flex: none; }
  #chatOpen { position: relative; flex: none; width: 46px; padding: 0; background: var(--bg2); box-shadow: none; transition: background .2s, color .2s; }
  #chatOpen[aria-expanded=true] { background: var(--z2); color: var(--ink); }
  #badge { position: absolute; top: -5px; right: -5px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--accent); color: #fff;
           font-size: 12px; line-height: 20px; text-align: center; padding: 0 5px; box-shadow: 0 0 0 2px var(--bg); animation: pop .3s; }

  /* 聊天視窗：浮在遊戲上方 */
  #scrim { position: absolute; inset: 0; z-index: 6; background: #061b1c99; opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s; }
  #chatWin { position: absolute; left: 10px; right: 10px; top: 4px; bottom: 10px; z-index: 7; background: var(--panel); color: var(--ink);
             border-radius: 22px; box-shadow: 0 18px 40px #000a; display: flex; flex-direction: column; overflow: hidden;
             transform-origin: 24px calc(100% + 30px); transform: translateY(30px) scale(.6); opacity: 0; visibility: hidden;
             transition: transform .34s cubic-bezier(.2, .9, .3, 1.15), opacity .2s, visibility 0s .34s; }
  .chat-on #scrim { opacity: 1; visibility: visible; transition: opacity .25s; }
  .chat-on #chatWin { transform: none; opacity: 1; visibility: visible; transition: transform .38s cubic-bezier(.2, .9, .3, 1.15), opacity .2s; }
  #chatClose { position: absolute; top: 10px; right: 10px; z-index: 1; width: 40px; height: 40px; min-height: 0; padding: 0; border-radius: 50%; background: var(--ink); color: #fff; box-shadow: none; }
  #msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 14px 12px; display: flex; flex-direction: column; gap: 8px; -webkit-user-select: text; user-select: text; }
  .msg { display: flex; align-items: flex-end; gap: 8px; max-width: 86%; }
  .msg > i { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-style: normal; font-size: 13px; font-weight: 900; }
  .msg p { margin: 0; padding: 8px 12px; border-radius: 16px 16px 16px 4px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg.me p { background: var(--accent); color: #fff; box-shadow: none; border-radius: 16px 16px 4px 16px; }
  .msg.cont > i { visibility: hidden; }
  .empty { margin: auto; color: var(--line); }

  /* 彈幕 */
  #danmaku { position: absolute; inset: 0; z-index: 5; overflow: hidden; pointer-events: none; }
  #danmaku span { position: absolute; left: 0; display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 16px; font-weight: 800;
                  padding: 3px 12px 3px 3px; border-radius: 999px; background: #102b2cd9; color: #fff; box-shadow: 0 2px 8px #0006; will-change: transform; }
  #danmaku span i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 12px; }

  /* 連線燈與狀態卡 */
  button.chip { min-height: 40px; color: var(--panel); box-shadow: none; font: inherit; font-weight: 800; font-size: 14px; letter-spacing: 1px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #3ddc97; box-shadow: 0 0 0 3px #3ddc9733; transition: background .3s, box-shadow .3s; }
  .dot.warn { background: var(--z2); box-shadow: 0 0 0 3px #f4c54240; animation: pulse 1.2s infinite; }
  .dot.bad { background: var(--accent); box-shadow: 0 0 0 3px #e2483d40; animation: pulse .8s infinite; }
  .dot.idle { background: #9fb3b3; box-shadow: none; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px transparent; } }
  #netCard { position: absolute; top: 4px; right: 12px; z-index: 9; width: min(280px, calc(100% - 24px)); background: var(--panel); color: var(--ink);
             border-radius: 18px; padding: 14px; box-shadow: 0 14px 34px #000a; transform-origin: calc(100% - 30px) -10px;
             transform: scale(.7); opacity: 0; visibility: hidden; transition: transform .25s cubic-bezier(.2,.9,.3,1.2), opacity .18s, visibility 0s .25s; }
  #netCard.on { transform: none; opacity: 1; visibility: visible; transition: transform .25s cubic-bezier(.2,.9,.3,1.2), opacity .18s; }
  #netCard .st { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 17px; }
  #netCard .st .dot { width: 14px; height: 14px; }
  #netCard .peers { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
  #netCard .peers i { position: relative; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-style: normal; font-size: 13px; font-weight: 900; }
  #netCard .peers i.lost { filter: grayscale(1); opacity: .45; }
  #netCard .lines { display: flex; gap: 6px; margin-top: 10px; }
  #netCard .lines b { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
  #netCard .lines b.up { background: #3ddc97; }
  #netCard .lines b.p2p.up { background: #2f6fd6; }
  #netCard .hint { margin: 10px 0 0; font-size: 14px; color: var(--muted); font-weight: 700; }
  #netCard button { width: 100%; margin-top: 12px; }
  .av.off > i { filter: grayscale(1); opacity: .45; }
  .av .lost { position: absolute; top: 28px; left: 0; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; box-shadow: 0 0 0 2px var(--bg); }
  @media (max-height: 640px) {
    #people { padding-top: 6px; padding-bottom: 4px; } .av > i { width: 38px; height: 38px; font-size: 16px; } .av .sc { top: 25px; }
    .top { padding-top: 4px; padding-bottom: 2px; } .card { padding: 10px 12px; } .clue { font-size: 19px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation-duration: .01s !important; animation-delay: 0s !important; } }
</style>
</head>
<body>
<div class="top">

<script type="module">
{
const $ = id => document.getElementById(id);
const CARDS = window.WL_CARDS;
const CX = 200, CY = 206, R = 186;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const params = new URLSearchParams(location.search);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- 連線層：正式版用 Trystero（瀏覽器直連），?local 用同瀏覽器分頁模擬 ----------
function mockJoin(code) {
  const bc = new BroadcastChannel('wl-mock-' + code);
  const uid = 'u' + Math.random().toString(36).slice(2, 9);
  const S = {}, U = {}, sl = {}, ul = {}, peers = {}, jl = [], ll = [];
  let clock = 0;
  const ts = () => Math.max(Date.now(), ++clock);
  const post = m => bc.postMessage({ ...m, from: uid });
  const newer = (a, b) => !b || a.ts > b.ts || (a.ts === b.ts && a.by > b.by);
  const applyS = (ns, rec) => { if (newer(rec, S[ns])) { const prev = S[ns]?.val; S[ns] = rec; (sl[ns] || []).forEach(f => f(rec.val, { userId: rec.by, prev })); } };
  const applyU = (ns, id, rec) => { U[ns] ??= {}; if (newer(rec, U[ns][id])) { U[ns][id] = rec; (ul[ns] || []).forEach(f => f(rec.val, { userId: id, self: id === uid })); } };
  const dump = () => { for (const ns in S) post({ t: 's', ns, rec: S[ns] }); for (const ns in U) if (U[ns][uid]) post({ t: 'u', ns, rec: U[ns][uid] }); };
  bc.onmessage = ({ data: m }) => {
    if (m.t === 'bye') { delete peers[m.from]; ll.forEach(f => f({ userId: m.from })); return; }
    if (!peers[m.from]) { peers[m.from] = 1; jl.forEach(f => f({ userId: m.from })); post({ t: 'hi' }); dump(); }
    if (m.t === 's') applyS(m.ns, m.rec);
    if (m.t === 'u') applyU(m.ns, m.from, m.rec);
  };
  addEventListener('pagehide', () => post({ t: 'bye' }));
  setTimeout(() => post({ t: 'hi' }), 50);
  return {
    ready: Promise.resolve(),
    getSelf: async () => ({ userId: uid }),
    getUsers: () => Object.fromEntries(Object.keys(peers).map(k => [k, {}])),
    onUserJoin: f => jl.push(f), onUserLeave: f => ll.push(f), onError: () => {},
    makeState(ns, init) {
      return {
        get: () => (S[ns] ? S[ns].val : init),
        async set(next) { const v = typeof next === 'function' ? next(S[ns] ? S[ns].val : init) : next; const rec = { val: v, ts: ts(), by: uid }; applyS(ns, rec); post({ t: 's', ns, rec }); },
        onChange: f => { (sl[ns] ??= []).push(f); },
      };
    },
    makeUserState(ns, init) {
      const all = () => Object.fromEntries(Object.entries(U[ns] || {}).map(([k, r]) => [k, r.val]));
      return {
        get: (id = uid) => (U[ns]?.[id] ? U[ns][id].val : init),
        getAll: all,
        async set(next) { const cur = U[ns]?.[uid]?.val ?? init; const v = typeof next === 'function' ? next(cur) : next; const rec = { val: v, ts: ts(), by: uid }; applyU(ns, uid, rec); post({ t: 'u', ns, rec }); },
        onChange: f => { (ul[ns] ??= []).push(f); },
      };
    },
  };
}

// ---------- 正式連線：MQTT 中繼為主（兩台伺服器同時用），P2P 直連為備援 ----------
// 每則訊息同時送進所有線路，收到重複的用「最後寫入為準」去重；任何一條通就能玩。
const DEV = ['localhost', '127.0.0.1'].includes(location.hostname);
const BROKERS = DEV && params.get('brokers') ? params.get('brokers').split(',') : ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const MQTT_SRC = DEV && params.get('mqttsrc') ? params.get('mqttsrc') : 'https://cdn.jsdelivr.net/npm/mqtt@5.16.1/dist/mqtt.esm.js';
const b64 = u8 => btoa(String.fromCharCode(...u8));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function relayJoin(code) {
  const enc = new TextEncoder(), dec = new TextDecoder();
  const hash = [...new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode('wl-jz:' + code)))].map(b => b.toString(16).padStart(2, '0')).join('');
  const base = 'wl-jz/v1/' + hash.slice(0, 20);
  const raw = await crypto.subtle.importKey('raw', enc.encode('wavelength:' + code), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: enc.encode('wl-jz-salt'), iterations: 50000, hash: 'SHA-256' }, raw, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  const seal = async obj => { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)))); return b64(iv) + '.' + b64(ct); };
  const open = async str => { try { const [iv, ct] = String(str).split('.'); return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(iv) }, key, unb64(ct)))); } catch { return null; } };

  let uid = null;
  try { uid = sessionStorage.getItem('wl:uid:' + code); } catch {}
  if (!uid) { uid = 'u' + Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem('wl:uid:' + code, uid); } catch {} }

  // 本地資料：共享狀態、每人狀態、在線名單
  const S = {}, U = {}, sl = {}, ul = {}, jl = [], ll = [], el = [];
  const heard = {}, gone = {}, online = new Set();
  let clock = 0;
  const tick = () => (clock = Math.max(Date.now(), clock + 1));
  const newer = (a, b) => !b || a.ts > b.ts || (a.ts === b.ts && a.by > b.by);
  const applyS = (ns, rec) => { if (!rec || typeof rec.ts !== 'number') return; clock = Math.max(clock, rec.ts); if (newer(rec, S[ns])) { S[ns] = rec; (sl[ns] || []).forEach(f => f(rec.val, { userId: rec.by })); } };
  const applyU = (ns, id, rec) => { if (!rec || typeof rec.ts !== 'number') return; clock = Math.max(clock, rec.ts); U[ns] ??= {}; if (newer(rec, U[ns][id])) { U[ns][id] = rec; (ul[ns] || []).forEach(f => f(rec.val, { userId: id, self: id === uid })); } };
  function sweep() {
    const now = Date.now();
    for (const id of Object.keys(heard)) {
      const isOn = id !== uid && !gone[id] && now - heard[id] < 45000;
      if (isOn && !online.has(id)) { online.add(id); jl.forEach(f => f({ userId: id })); }
      if (!isOn && online.has(id)) { online.delete(id); ll.forEach(f => f({ userId: id })); }
    }
  }
  function seen(id, on = true) { if (!id || id === uid) return; heard[id] = Date.now(); gone[id] = !on; sweep(); }
  function handle(m) {
    if (!m || typeof m !== 'object') return;
    if (m.k === 'p') return seen(m.id, !!m.on);
    if (m.k === 's') { seen(m.rec && m.rec.by); return applyS(m.ns, m.rec); }
    if (m.k === 'u') { seen(m.id); return applyU(m.ns, m.id, m.rec); }
    if (m.k === 'hi') { seen(m.id); p2pDump(); }
  }

  // --- MQTT 線路 ---
  const clients = [];
  let mqttLib = null;
  mqttLib = await getMqtt();
  const willMsg = await seal({ k: 'p', id: uid, on: 0 });
  const emitErr = code => el.forEach(f => f({ code }));
  if (mqttLib) for (const url of BROKERS) {
    const c = mqttLib.connect(url, { keepalive: 20, reconnectPeriod: 2500, connectTimeout: 8000, clean: true,
      clientId: 'wl_' + uid + '_' + Math.random().toString(36).slice(2, 6),
      will: { topic: `${base}/p/${uid}`, payload: willMsg, retain: true, qos: 0 } });
    c.on('connect', async () => {
      c.subscribe(base + '/#', { qos: 0 });
      c.publish(`${base}/p/${uid}`, await seal({ k: 'p', id: uid, on: 1 }), { retain: true });
      for (const ns in U) if (U[ns][uid]) c.publish(`${base}/u/${uid}/${ns}`, await seal({ k: 'u', ns, id: uid, rec: U[ns][uid] }), { retain: true });
      // 伺服器若重啟會遺失保留資料，重連時把手上最新的共享狀態補回去（較舊的會被自動忽略）
      for (const ns in S) c.publish(`${base}/s/${ns}`, await seal({ k: 's', ns, rec: S[ns] }), { retain: true });
      changed();
    });
    c.on('message', async (topic, payload) => handle(await open(payload.toString())));
    c.on('offline', () => { emitErr('relay-offline'); changed(); });
    c.on('close', changed);
    c.on('error', () => emitErr('relay-error'));
    clients.push(c);
  }
  const relayUp = () => clients.filter(c => c.connected).length;

  // --- P2P 線路（備援，載入失敗也不影響） ---
  let p2pSend = null, p2pPeers = 0;
  async function p2pDump() {
    if (!p2pSend) return;
    for (const ns in S) p2pSend(await seal({ k: 's', ns, rec: S[ns] }));
    for (const ns in U) if (U[ns][uid]) p2pSend(await seal({ k: 'u', ns, id: uid, rec: U[ns][uid] }));
  }
  if (!params.has('nop2p')) (async () => {
    try {
      const { joinRoom } = await import('https://cdn.jsdelivr.net/npm/trystero@0.27.0/+esm');
      const r = joinRoom({ appId: 'josephinezulin.github.io/my-games/wavelength', password: 'wl-' + code }, code);
      const act = r.makeAction('m');
      p2pSend = data => { try { act.send(data); } catch {} };
      act.onMessage(async data => handle(await open(data)));
      r.onPeerJoin(async () => { p2pPeers++; changed(); p2pSend(await seal({ k: 'hi', id: uid })); p2pDump(); });
      r.onPeerLeave(() => { p2pPeers = Math.max(0, p2pPeers - 1); changed(); });
      r.onError(() => {});
    } catch (e) { console.warn('p2p unavailable', e); }
  })();

  async function broadcast(topic, obj, retain) {
    const data = await seal(obj);
    for (const c of clients) if (c.connected) c.publish(topic, data, { retain, qos: 0 });
    if (p2pSend) p2pSend(data);
  }
  const statusL = [];
  function changed() { statusL.forEach(f => f()); }
  // 心跳：讓其他人知道我還在
  setInterval(() => { broadcast(`${base}/p/${uid}`, { k: 'p', id: uid, on: 1 }, true); sweep(); }, 15000);
  setInterval(sweep, 5000);
  addEventListener('pagehide', () => { broadcast(`${base}/p/${uid}`, { k: 'p', id: uid, on: 0 }, true); });

  // 等第一台伺服器連上（最多 8 秒），讓保留的遊戲狀態先送到
  await new Promise(res => {
    if (!clients.length) return res();
    const t = setTimeout(res, 8000);
    clients.forEach(c => c.once('connect', () => setTimeout(() => { clearTimeout(t); res(); }, 600)));
  });

  return {
    getSelf: async () => ({ userId: uid }),
    getUsers: () => Object.fromEntries([...online].map(k => [k, {}])),
    onUserJoin: f => jl.push(f), onUserLeave: f => ll.push(f), onError: f => el.push(f),
    onStatus: f => statusL.push(f),
    status: () => ({ relays: relayUp(), relayTotal: clients.length, p2p: p2pPeers }),
    makeState(ns, init) {
      return {
        get: () => (S[ns] ? S[ns].val : init),
        async set(next) {
          const v = typeof next === 'function' ? next(S[ns] ? S[ns].val : init) : next;
          const rec = { val: v, ts: tick(), by: uid }; applyS(ns, rec);
          await broadcast(`${base}/s/${ns}`, { k: 's', ns, rec }, true);
        },
        onChange: f => { (sl[ns] ??= []).push(f); },
      };
    },
    makeUserState(ns, init) {
      return {
        get: (id = uid) => (U[ns]?.[id] ? U[ns][id].val : init),
        getAll: () => Object.fromEntries(Object.entries(U[ns] || {}).map(([k, r]) => [k, r.val])),
        async set(next) {
          const cur = U[ns]?.[uid]?.val ?? init; const v = typeof next === 'function' ? next(cur) : next;
          const rec = { val: v, ts: tick(), by: uid }; applyU(ns, uid, rec);
          await broadcast(`${base}/u/${uid}/${ns}`, { k: 'u', ns, id: uid, rec }, true);
        },
        onChange: f => { (ul[ns] ??= []).push(f); },
      };
    },
  };
}

// ---------- 公開房間大廳：所有公開房間把簡介貼到同一個頻道 ----------
const LOBBY = 'wl-jz/v1/lobby';
let lobbyBusP = null;
function getMqtt() { if (!getMqtt.p) getMqtt.p = import(MQTT_SRC).then(m => m.default).catch(() => null); return getMqtt.p; }
function lobbyConnect() {
  if (lobbyBusP) return lobbyBusP;
  lobbyBusP = (async () => {
    const subs = [];
    if (params.has('local')) {
      const bc = new BroadcastChannel('wl-mock-lobby'), mine = {};
      bc.onmessage = ({ data: m }) => { if (m.t === 'req') { for (const c in mine) bc.postMessage({ t: 'a', code: c, info: mine[c] }); } else if (m.t === 'a') subs.forEach(f => f(m.code, m.info)); };
      return { publish(code, info) { if (info) mine[code] = info; else delete mine[code]; bc.postMessage({ t: 'a', code, info }); }, on(f) { subs.push(f); bc.postMessage({ t: 'req' }); } };
    }
    const mqtt = await getMqtt(), clients = [];
    if (mqtt) for (const url of BROKERS) {
      const c = mqtt.connect(url, { keepalive: 30, reconnectPeriod: 3000, connectTimeout: 8000, clientId: 'wlL_' + Math.random().toString(36).slice(2, 10) });
      c.on('connect', () => c.subscribe(LOBBY + '/+'));
      c.on('message', (t, p) => { const code = t.split('/').pop(); let info = null; try { const str = p.toString(); info = str ? JSON.parse(str) : null; } catch {} subs.forEach(f => f(code, info)); });
      clients.push(c);
    }
    return { publish(code, info) { for (const c of clients) if (c.connected) c.publish(LOBBY + '/' + code, info ? JSON.stringify(info) : '', { retain: true }); }, on(f) { subs.push(f); } };
  })();
  return lobbyBusP;
}

async function connect(code) {
  if (params.has('local')) return mockJoin(code);
  return relayJoin(code);
}

function avatarInline(id) {

  Object.assign(i.style, { display: 'inline-grid', placeItems: 'center', width: '24px', height: '24px', borderRadius: '50%', color: '#fff', fontStyle: 'normal', fontSize: '12px', verticalAlign: '-6px' });
  return i;
}

// ---------- 結算動畫 ----------
function confetti(box, count = 70) {
  if (reduceMotion) return;
  const layer = el('div', 'confetti'); box.append(layer);
  const H = box.clientHeight + 40, cols = ['#f4c542', '#e2483d', '#2f6fd6', '#3ddc97', '#f28c38', '#8e44ad'];
  for (let i = 0; i < count; i++) {
    const c = document.createElement('i');
    c.style.left = Math.random() * 100 + '%';
    c.style.background = cols[i % cols.length];
    layer.append(c);
    const drift = (Math.random() - .5) * 120, spin = (Math.random() - .5) * 1080;
    c.animate([{ transform: 'translate(0,0) rotate(0)' }, { transform: `translate(${drift}px, ${H}px) rotate(${spin}deg)` }],
      { duration: 1800 + Math.random() * 1400, delay: Math.random() * 500, easing: 'cubic-bezier(.3,.6,.5,1)', fill: 'both' });
  }
  setTimeout(() => layer.remove(), 4000);
}
function countUp(node, to, delay, dur = 700) {
  if (reduceMotion) { node.textContent = String(to); return; }
  node.textContent = '0';
  setTimeout(() => {
    const t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / dur); node.textContent = String(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }, delay);
}
function renderEnd(g) {
  const box = $('endBox'); box.replaceChildren();
  const again = el('button', '', SVG.again + '<span>再來一局</span>'); again.id = 'againBtn';
  again.onclick = () => game.set(p => ({ ...initialGame, host: p.host, pub: !!p.pub, per: p.per, phase: 'lobby' }));
  if (g.mode === 'coop') {
    const max = g.total * 4, ratio = g.score / max, starsOn = ratio >= .75 ? 3 : ratio >= .5 ? 2 : ratio >= .25 ? 1 : 0;
    const wrapEl = el('div', 'coopEnd');
    const stars = el('div', 'stars', [0, 1, 2].map(i => SVG.star(44)).join(''));
    [...stars.children].forEach((s, i) => { if (i < starsOn) { s.classList.add('on'); s.style.animation = `zoom .5s ${0.9 + i * .25}s backwards`; } });
    const big = el('div', 'big'); const sub = el('div', 'say'); sub.textContent = `/ ${max}`;
    wrapEl.append(stars, big, sub); box.append(wrapEl, again);
    countUp(big, g.score, 200, 900);
    again.style.animationDelay = '1.8s'; again.classList.add('shown');
    if (starsOn >= 2) setTimeout(() => confetti(box, 50), 1500);
    return;
  }
  const ranked = [...new Set([...g.order, ...Object.keys(g.scores)])].sort((a, b) => (g.scores[b] || 0) - (g.scores[a] || 0));
  const top = g.scores[ranked[0]] || 0, winners = ranked.filter(id => (g.scores[id] || 0) === top);
  const head = el('div', 'winner'); head.style.opacity = '0';
  head.append(winners.map(nameOf).join('、'));
  const sub = document.createElement('small'); sub.textContent = winners.length > 1 ? '平手' : '獲勝'; head.append(sub);
  const wrapEl = el('div', 'podium-wrap'), pod = el('div', 'podium');
  const slots = [['second', ranked[1], 1], ['first', ranked[0], 2], ['third', ranked[2], 0]];
  const T = { third: 300, second: 1100, first: 1900 };
  for (const [cls, id] of slots) {
    const col = el('div', 'pcol ' + cls);
    if (id) {
      const who = el('div', 'who'); who.append(avatarEl(id));
      const nm = document.createElement('small'); nm.textContent = nameOf(id); who.append(nm);
      if ((g.scores[id] || 0) === top) { const cr = el('span', 'crown', SVG.crown(34)); cr.style.animation = `crown .7s ${T.first + 900}ms forwards`; who.append(cr); }
      const bar = el('div', 'bar'); const rk = document.createElement('b'); rk.textContent = String(ranked.indexOf(id) + 1);
      const sc = document.createElement('span'), scn = document.createElement('em'); scn.style.fontStyle = 'normal';
      sc.innerHTML = SVG.star(14); sc.append(scn); bar.append(rk, sc);
      bar.style.animation = `grow .6s ${T[cls]}ms cubic-bezier(.2,.9,.3,1.1) forwards`;
      who.style.animation = `rise .45s ${T[cls] + 450}ms forwards`;
      countUp(scn, g.scores[id] || 0, T[cls] + 200);
      col.append(who, bar);
    }
    pod.append(col);
  }
  wrapEl.append(pod);
  const rest = el('div', 'rest');
  ranked.slice(3).forEach((id, i) => {
    const d = document.createElement('div'); d.append(String(i + 4) + '.', avatarEl(id), `${g.scores[id] || 0}`); rest.append(d);
  });
  if (ranked.length > 3) { rest.style.opacity = '0'; rest.style.animation = `fadeIn .4s ${T.first + 1400}ms forwards`; }
  box.append(head, wrapEl, rest, again);
  head.style.animation = `zoom .6s ${T.first + 1000}ms forwards`;
  again.style.animationDelay = (T.first + 1800) + 'ms'; again.classList.add('shown');
  setTimeout(() => confetti(box), T.first + 1000);
}

// ---------- 聊天 ----------
let seen = null, joinedAt = Date.now(), unread = 0, lanes = [0, 0, 0, 0, 0];
function chatList() {
  const list = [];
  for (const [id, arr] of Object.entries(chat ? chat.getAll() : {})) for (const m of arr || []) list.push({ ...m, id, k: id + ':' + m.t });
  return list.sort((a, b) => a.t - b.t);
}
const chatOpen = () => document.body.classList.contains('chat-on');
function setUnread(n) { unread = n; $('badge').classList.toggle('hide', !n); text($('badge'), n > 99 ? '99+' : String(n)); }
function fly(m) {
  const box = $('danmaku'), W = box.clientWidth, H = box.clientHeight;
  const now = Date.now();
  let lane = lanes.indexOf(Math.min(...lanes));
  const free = lanes.findIndex(t => t < now); if (free !== -1) lane = free;
  const s = document.createElement('span'), av = avatarEl(m.id);
  s.append(av, String(m.x));
  s.style.top = (Math.max(6, H * 0.03) + lane * 38) + 'px';
  box.append(s);
  const w = s.offsetWidth, dur = 11000 + Math.min(String(m.x).length, 40) * 80;
  lanes[lane] = now + dur * (w + 40) / (W + w);
  if (reduceMotion) { s.style.transform = `translateX(${Math.max(8, (W - w) / 2)}px)`; setTimeout(() => s.remove(), 3500); return; }
  const anim = s.animate([{ transform: `translateX(${W}px)` }, { transform: `translateX(${-w - 10}px)` }], { duration: dur, easing: 'linear' });
  anim.onfinish = () => s.remove();
}
function renderChat() {
  const list = chatList();
  if (seen === null) seen = new Set(list.map(m => m.k));
  else for (const m of list) if (!seen.has(m.k)) { seen.add(m.k); if (!chatOpen() && m.t > joinedAt - 3000) { fly(m); if (m.id !== me) setUnread(unread + 1); } }
  const box = $('msgs');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  if (!list.length) { box.replaceChildren(el('div', 'empty', SVG.chat)); return; }
  let prev = null;
  box.replaceChildren(...list.slice(-150).map(m => {
    const row = el('div', 'msg' + (m.id === me ? ' me' : '') + (prev === m.id ? ' cont' : ''));
    prev = m.id;
    const av = avatarEl(m.id); av.title = nameOf(m.id);
    const p = document.createElement('p'); p.textContent = String(m.x);
    row.append(av, p); return row;
  }));
  if (atBottom || list[list.length - 1].id === me) box.scrollTop = box.scrollHeight;
}
function toggleChat(open) {
  document.body.classList.toggle('chat-on', open);
  $('chatOpen').setAttribute('aria-expanded', String(open));
  $('chatWin').setAttribute('aria-hidden', String(!open));
  if (open) { setUnread(0); $('danmaku').replaceChildren(); const box = $('msgs'); box.scrollTop = box.scrollHeight; }
}

// ---------- 連線狀態：房號旁的燈＋頭像斷線標示 ----------
let lastErr = 0, lastErrCode = '';
const ICON_LOST = '<svg viewBox="0 0 24 24" width="12" height="12"><path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0M3 3l18 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';
function netState() {
  if (!room) return { cls: 'idle' };
  const g = G(), peers = online().length - 1;
  const expected = [...new Set(g.order)].filter(id => id !== me);
  const lost = expected.filter(id => !online().includes(id));
  const st = room.status ? room.status() : { relays: 1, relayTotal: 1, p2p: 0 };
  const recentErr = Date.now() - lastErr < 15000;
  if (!navigator.onLine) return { cls: 'bad', title: '網路斷了', hint: '檢查 Wi-Fi 或行動網路', fix: true, lost, st };
  if (st.relays === 0 && st.p2p === 0) return { cls: 'bad', title: '連不上伺服器', hint: '正在自動重試，也可以按下面重新連線', fix: true, lost, st };
  if (lost.length) return { cls: 'warn', title: '有人斷線', hint: '灰色頭像的玩家暫時連不上，會自動重連', fix: false, lost, st };
  if (st.relays < st.relayTotal && recentErr) return { cls: 'warn', title: '線路切換中', hint: '有一條線路斷了，其他線路還在', fix: false, lost, st };
  if (peers === 0) return { cls: 'idle', title: '等朋友加入', hint: '', lost, st };
  return { cls: '', title: '連線正常', hint: '', lost, st };
}
function renderNet() {
  const st = netState();
  $('netDot').className = 'dot ' + st.cls;
  $('netDot2').className = 'dot ' + st.cls;
  text($('netTitle'), st.title || '');
  text($('netHint'), st.hint || '');
  $('netHint').classList.toggle('hide', !st.hint);
  $('reconnectBtn').classList.toggle('hide', !st.fix);
  if (st.st) { const L = $('netLines'); L.replaceChildren(...Array.from({ length: st.st.relayTotal }, (_, i) => { const b = document.createElement('b'); b.className = i < st.st.relays ? 'up' : ''; b.title = '中繼線路'; return b; }), (() => { const b = document.createElement('b'); b.className = 'p2p' + (st.st.p2p ? ' up' : ''); b.title = 'P2P 直連'; return b; })()); }
  if (room) {
    const on = online(), ids = [...new Set([...G().order, ...on])];
    $('netPeers').replaceChildren(...ids.map(id => { const i = avatarEl(id); if (!on.includes(id)) i.className = 'lost'; i.title = nameOf(id); return i; }));
  }
}
function toggleNet(open) {
  $('netCard').classList.toggle('on', open);
  $('roomChip').setAttribute('aria-expanded', String(open));
  if (open) renderNet();
}

// ---------- 進房 ----------
function newCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; return Array.from({ length: 4 }, () => A[Math.floor(Math.random() * A.length)]).join(''); }
function hashCode() { const h = location.hash.slice(1).toUpperCase(); return /^[A-Z0-9]{4,6}$/.test(h) ? h : ''; }
function roomLink() { return location.href.split('#')[0] + '#' + code; }

async function enter(c, creating = false) {
  const name = $('nameIn').value.trim();
  if (!name) { $('nameIn').focus(); $('nameIn').animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'none' }], { duration: 250, iterations: 2 }); return; }
  store.set('wl:name', name);
  code = c;
  if (location.hash.slice(1) !== c) history.replaceState(null, '', '#' + c);
  $('joinErr').innerHTML = '<span class="eq"><span class="wait"><i></i><i></i><i></i></span></span>';
  try { room = await connect(code); } catch (e) { room = null; text($('joinErr'), '連線元件載入失敗，請檢查網路'); return; }
  me = (await room.getSelf()).userId;
  joinedAt = Date.now();
  game = room.makeState('game', initialGame);
  dial = room.makeState('dial', 90);
  profile = room.makeUserState('profile', { name });
  chat = room.makeUserState('chat', []);
  guessSt = room.makeUserState('guess', null);
  await profile.set({ name });
  game.onChange(render); guessSt.onChange(render);
  dial.onChange(() => { if (!dragging && G().psychic === me) renderWheel(); });
  profile.onChange(() => { render(); renderChat(); }); chat.onChange(renderChat);
  if (room.onStatus) room.onStatus(renderNet);
  room.onUserJoin(() => { render(); renderNet(); }); room.onUserLeave(() => { render(); renderNet(); });
  room.onError(e => { lastErr = Date.now(); lastErrCode = e && e.code ? e.code : ''; renderNet(); });
  setInterval(renderNet, 3000);
  addEventListener('online', renderNet); addEventListener('offline', renderNet);
  $('joinView').classList.add('hide');
  ['gameView', 'people', 'chatBar', 'roomChip'].forEach(id => $(id).classList.remove('hide'));
  text($('roomCode'), code);
  render(); renderChat(); renderNet();
  if (creating) await game.set(p => (p && p.host ? p : { ...initialGame, ...(p || {}), host: me, per: wantPer, pub: wantPub }));
  setInterval(() => announce(true), 20000);
  addEventListener('pagehide', () => { if (G().pub && online().length <= 1 && lobbyBus) lobbyBus.publish(code, null); });
}

$('nameIn').value = store.get('wl:name') || '';
function showJoin() {
  const h = hashCode();
  $('newBox').classList.toggle('hide', !!h);
  $('hashBox').classList.toggle('hide', !h);
  text($('hashCode'), h);
}
// 大廳列表
const lobbyRooms = {};
function renderRooms() {
  const box = $('roomList'); if (!box) return;
  const now = Date.now();
  const list = Object.entries(lobbyRooms).filter(([c, i]) => i && now - i.t < 60000 && now - i.t > -60000)
    .sort((a, b) => (a[1].phase === 'lobby' ? 0 : 1) - (b[1].phase === 'lobby' ? 0 : 1) || b[1].t - a[1].t);
  if (!list.length) { box.innerHTML = `<div class="none">${ICON_GLOBE.replace(/18/g, '30')}<span>目前沒有公開房間</span></div>`; return; }
  box.replaceChildren(...list.map(([c, i]) => {
    const b = el('button', 'room');
    const cd = el('span', 'code'); cd.textContent = c;
    const faces = el('span', 'faces');
    (Array.isArray(i.players) ? i.players : []).slice(0, 6).forEach(pl => {
      const f = document.createElement('i'); f.textContent = String(pl && pl.n || '?').slice(0, 2);
      f.style.background = COLORS.includes(pl && pl.c) ? pl.c : COLORS[7]; faces.append(f);
    });
    const n = Array.isArray(i.players) ? i.players.length : 0;
    const st = el('span', 'st' + (i.phase && i.phase !== 'lobby' ? ' live' : ''));
    if (i.phase === 'lobby') st.innerHTML = SVG.person.replace(/22/g, '16') + `<em style="font-style:normal">${n}</em>`;
    else { st.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>'; st.append(`${Number(i.round) || 0}/${Number(i.total) || 0}`); }
    const go = el('span', 'go', SVG.next);
    b.append(cd, faces, st, go);
    b.setAttribute('aria-label', `加入房間 ${c}`);
    b.onclick = () => enter(c);
    return b;
  }));
}
lobbyConnect().then(bus => { lobbyBus = bus; bus.on((c, info) => { if (!/^[A-Z0-9]{4,6}$/.test(c)) return; if (info && typeof info === 'object' && typeof info.t === 'number') lobbyRooms[c] = info; else delete lobbyRooms[c]; if (!room) renderRooms(); }); });
setInterval(() => { if (!room) renderRooms(); }, 10000);
renderRooms();
renderPriv($('privPick'), wantPub, true);

showJoin();
try { const auto = sessionStorage.getItem('wl:auto'); sessionStorage.removeItem('wl:auto'); if (auto && auto === hashCode() && $('nameIn').value.trim()) setTimeout(() => enter(auto), 0); } catch {}
renderSeg($('perPick'), wantPer, true);
$('createBtn').onclick = () => enter(newCode(), true);
$('joinCodeBtn').onclick = () => { const c = $('codeIn').value.trim().toUpperCase(); if (!/^[A-Z0-9]{4,6}$/.test(c)) { $('codeIn').focus(); return; } enter(c); };
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('joinCodeBtn').click(); });
$('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') (hashCode() ? $('joinHashBtn') : $('createBtn')).click(); });
$('joinHashBtn').onclick = () => enter(hashCode());
$('otherBtn').onclick = () => { history.replaceState(null, '', location.pathname + location.search); showJoin(); };
$('startBtn').onclick = startGame;
// 線索送出：用 pointerdown 避免鍵盤收起造成版面跳動而按不到
$('clueBtn').addEventListener('pointerdown', e => { e.preventDefault(); sendClue(); });
$('clueBtn').onclick = e => { if (e.detail === 0) sendClue(); };
$('clueIn').addEventListener('focus', () => document.body.classList.add('typing'));
$('clueIn').addEventListener('blur', () => document.body.classList.remove('typing'));
$('chatIn').addEventListener('focus', () => document.body.classList.add('chatting'));
$('chatIn').addEventListener('blur', () => document.body.classList.remove('chatting'));
$('clueIn').addEventListener('keydown', e => { if (e.key === 'Enter') sendClue(); });
$('copyBtn').onclick = async () => {
  const lbl = $('copyBtn').querySelector('span');
  try { await navigator.clipboard.writeText(roomLink()); lbl.textContent = '已複製'; }
  catch { lbl.textContent = code; }
  setTimeout(() => { lbl.textContent = '邀請'; }, 2000);
};
$('chatBar').addEventListener('submit', async e => {
  e.preventDefault();
  const x = $('chatIn').value.trim();
  if (!x || !chat) return;
  $('chatIn').value = '';
  await chat.set(prev => [...(prev || []), { t: Date.now(), x }].slice(-40));
});
$('chatOpen').onclick = () => toggleChat(!chatOpen());
$('roomChip').onclick = e => { e.stopPropagation(); toggleNet(!$('netCard').classList.contains('on')); };
document.addEventListener('pointerdown', e => { if ($('netCard').classList.contains('on') && !e.target.closest('#netCard, #roomChip')) toggleNet(false); });
$('reconnectBtn').onclick = () => { try { sessionStorage.setItem('wl:auto', code); } catch {} location.reload(); };
$('chatClose').onclick = () => toggleChat(false);
$('scrim').onclick = () => toggleChat(false);
addEventListener('keydown', e => { if (e.key === 'Escape' && chatOpen()) toggleChat(false); });

// 手機鍵盤彈出時，讓整個版面貼齊可見區域，上下列保持固定
const vv = window.visualViewport;
function fitViewport() {
  const h = vv ? vv.height : innerHeight;
  document.documentElement.style.setProperty('--app-h', h + 'px');
  if (vv) { window.scrollTo(0, 0); document.body.style.transform = vv.offsetTop ? `translateY(${vv.offsetTop}px)` : ''; }
}
if (vv) { vv.addEventListener('resize', fitViewport); vv.addEventListener('scroll', fitViewport); }
addEventListener('resize', fitViewport);
fitViewport();

const wheel = $('wheel');
wheel.addEventListener('pointerdown', e => { if (!canDrag()) return; dragging = true; wheel.setPointerCapture(e.pointerId); pushDial(angleFromEvent(e)); });
wheel.addEventListener('pointermove', e => { if (dragging) pushDial(angleFromEvent(e)); });
const endDrag = () => { if (!dragging) return; dragging = false; if (G().mode === 'coop') dial.set(Math.round(localDial)); };
wheel.addEventListener('pointerup', endDrag); wheel.addEventListener('pointercancel', endDrag);
wheel.addEventListener('keydown', e => {
  if (!canDrag()) return;
  const d = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0;
  if (d) { e.preventDefault(); pushDial(clamp(localDial + d * (e.shiftKey ? 5 : 1), 0, 180)); }
});
addEventListener('hashchange', () => { if (!room) showJoin(); });
}
