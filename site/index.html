<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小遊戲合集</title>
<meta name="description" content="可以直接在手機或電腦瀏覽器玩的 HTML 小遊戲合集，不需要安裝。">
<style>
  /* VOICE  輕鬆的遊戲大廳
     IDEA   一排排遊戲卡匣
     PICTURE 每款遊戲一張彩色卡片，上方是簡單的圖形
     COLOUR 暖白底、深色字，每張卡用該遊戲自己的主色
     LAYOUT 手機兩欄、寬螢幕三欄 */
  :root { color-scheme: light; --bg: #f6f1e9; --ink: #2a2522; --muted: #7a6f66; }
  * { box-sizing: border-box; min-width: 0; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: clamp(20px, 4vw, 44px) 16px 40px; }
  h1 { margin: 0; font-size: clamp(28px, 6vw, 42px); font-weight: 900; line-height: 1.1; }
  .lead { color: var(--muted); margin: 6px 0 22px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 14px; }
  a.game { display: flex; flex-direction: column; text-decoration: none; color: var(--ink); background: #fff; border-radius: 18px; overflow: hidden;
           box-shadow: 0 4px 0 #0000001a, 0 0 0 1px #0000000d; transition: transform .15s; }
  a.game:hover { transform: translateY(-3px); }
  a.game:focus-visible { outline: 3px solid #e2483d; outline-offset: 3px; }
  .art { aspect-ratio: 16 / 9; display: grid; place-items: center; }
  .art svg { width: 46%; height: auto; }
  .info { padding: 12px 14px 14px; }
  .info h2 { margin: 0; font-size: 18px; font-weight: 900; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tag { font-size: 12px; font-weight: 800; background: #e2483d; color: #fff; border-radius: 999px; padding: 1px 8px; }
  .info p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { a.game { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>小遊戲合集</h1>
  <p class="lead">打開就能玩，手機和電腦都可以。</p>
  <div class="grid" id="grid"></div>
</div>
<script>
{
  const W = '#ffffff';
  const games = [
    { href: 'wavelength/', name: '同頻轉盤', tag: '多人連線', bg: '#0e3b3d', desc: '線上版 Wavelength。一人給線索、大家轉指針，附聊天室',
      art: `<svg viewBox="0 0 100 60"><path d="M6 56A44 44 0 0 1 94 56Z" fill="#fbf4e6"/><path d="M50 56L66 16A44 44 0 0 1 80 25Z" fill="#f28c38"/><path d="M50 56L71 18A44 44 0 0 1 76 22Z" fill="#e2483d"/><line x1="50" y1="56" x2="30" y2="20" stroke="#1f2a2b" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="56" r="6" fill="#1f2a2b"/></svg>` },
    { href: 'block/', name: '色塊脫逃', bg: '#4b6cf5', desc: '拖動色塊，從相同顏色的出口滑出棋盤，共 50 關',
      art: `<svg viewBox="0 0 100 70"><rect x="8" y="8" width="54" height="24" rx="6" fill="#ffd23f"/><rect x="8" y="38" width="24" height="24" rx="6" fill="#ff6b6b"/><rect x="38" y="38" width="54" height="24" rx="6" fill="${W}"/><rect x="68" y="8" width="24" height="24" rx="6" fill="#3ddc97"/></svg>` },
    { href: 'sultan/', name: '沙漠王朝', bg: '#7a4a1e', desc: '卡牌儀式遊戲，七天內完成蘇丹的旨意，有多重結局',
      art: `<svg viewBox="0 0 100 70"><rect x="16" y="10" width="34" height="50" rx="4" fill="#f3d27a" transform="rotate(-10 33 35)"/><rect x="50" y="10" width="34" height="50" rx="4" fill="${W}" transform="rotate(8 67 35)"/><circle cx="67" cy="35" r="9" fill="#c0392b"/></svg>` },
    { href: 'bounce/', name: '落球作戰', bg: '#6c3cd9', desc: '倒出彈珠穿過倍增門，把足夠的彈珠接進杯子，共 30 關',
      art: `<svg viewBox="0 0 100 70"><rect x="30" y="22" width="40" height="8" rx="4" fill="#3ddc97"/><circle cx="40" cy="10" r="5" fill="${W}"/><circle cx="56" cy="14" r="5" fill="${W}"/><circle cx="44" cy="40" r="5" fill="${W}"/><circle cx="58" cy="44" r="5" fill="${W}"/><path d="M34 52h32l-4 14H38Z" fill="#ffd23f"/></svg>` },
    { href: 'lord/', name: '攻城之王', bg: '#2f7d4f', desc: '左右滑動選路線，壯大軍隊攻下敵方城堡',
      art: `<svg viewBox="0 0 100 70"><path d="M28 64V28h8v8h8v-8h12v8h8v-8h8v36Z" fill="${W}"/><rect x="44" y="46" width="12" height="18" rx="6" fill="#2f7d4f"/><path d="M50 6v16M50 6l14 5-14 5" stroke="#ffd23f" stroke-width="3" fill="#ffd23f"/></svg>` },
    { href: 'runner/', name: '王者之路', bg: '#c2410c', desc: '無盡雙跑道衝鋒：選倍增門、擊退敵群、挑戰巨人',
      art: `<svg viewBox="0 0 100 70"><path d="M20 66L42 6h16l22 60Z" fill="#fde68a"/><line x1="50" y1="12" x2="50" y2="64" stroke="#c2410c" stroke-width="3" stroke-dasharray="6 6"/><circle cx="38" cy="50" r="7" fill="${W}"/><circle cx="62" cy="40" r="7" fill="${W}"/></svg>` },
    { href: 'color/', name: '調色師', bg: '#c98d55', desc: '在木製調色盤上混色，調出和目標一樣的顏色',
      art: `<svg viewBox="0 0 100 70"><path d="M50 6C24 6 8 22 8 38s14 26 30 26c8 0 8-8 4-12s0-10 8-10h14c14 0 28-6 28-18C92 14 74 6 50 6Z" fill="#f6e3c6"/><circle cx="30" cy="30" r="6" fill="#e2483d"/><circle cx="48" cy="20" r="6" fill="#3b82f6"/><circle cx="68" cy="22" r="6" fill="#ffd23f"/><circle cx="24" cy="46" r="6" fill="#3ddc97"/></svg>` },
  ];
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  document.getElementById('grid').innerHTML = games.map(g => `
    <a class="game" href="${g.href}">
      <div class="art" style="background:${g.bg}">${g.art}</div>
      <div class="info"><h2>${esc(g.name)}${g.tag ? `<span class="tag">${esc(g.tag)}</span>` : ''}</h2><p>${esc(g.desc)}</p></div>
    </a>`).join('');
}
</script>
</body>
</html>
