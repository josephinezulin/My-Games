name: Deploy game to GitHub Pages

on:
  push:
    branches: [main, claude/block-out-html-game-o0rlg5]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp build version (auto-update without ?v=)
        run: |
          V="${GITHUB_SHA::8}"
          sed -i "s/__BUILD__/$V/g" site/wavelength/index.html
          printf '{"v":"%s"}\n' "$V" > site/wavelength/version.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
